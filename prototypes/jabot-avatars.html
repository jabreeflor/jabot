<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>JaBot avatar candidates</title>
    <!--
      Five directions for a bot's identity (#44), side by side, sized to be
      reviewed on a phone.

      Every candidate is drawn from the same inputs the app already has — a
      name and a BotColor — so nothing here needs a new field in the store or a
      sprite dependency. Each one renders through the same five rungs of the
      size ramp the shell uses (54 / 44 / 38 / 30 / 28), twelve bots (four more
      than the palette has colours, on purpose), the four run states, and the
      three categories (bot / crew / code session).

      The two toggles at the top are the two checks the issue asks for:
      greyscale (is colour the only channel?) and light theme.
    -->
    <style>
      /* ---- tokens: the app's dark palette, plus a light theme for the check */
      :root {
        --win: #1c1c1e;
        --side: #1c1c1e;
        --chat: #151516;
        --raise: #2a2a2c;
        --raise2: #232325;
        --ink: #f2f2f2;
        --dim: #98989e;
        --faint: #8e8e93;
        --edge: #303033;
        --edge-strong: #37373a;
        --amber: #e8a33d;
        --red: #ff453a;
        --ok: #5dbb6e;
        --violet: #a78bfa;
        --font-ui:
          -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
        --r-lg: 12px;
        --r-xl: 16px;
        --r-pill: 99px;
        /* Ink used on top of a bot's colour. Dark on every one of the eight,
           which is why the palette is bright to begin with. */
        --on-color: #14141a;
      }

      html[data-theme="light"] {
        --win: #f6f6f4;
        --side: #ffffff;
        --chat: #efeeec;
        --raise: #ffffff;
        --raise2: #f4f3f1;
        --ink: #1c1c1e;
        --dim: #5c5c63;
        --faint: #6e6e73;
        --edge: #dcdbd8;
        --edge-strong: #c9c8c4;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: var(--chat);
        color: var(--ink);
        font: 15px/1.45 var(--font-ui);
        -webkit-font-smoothing: antialiased;
        padding: 0 0 64px;
      }

      /* ---- chrome */
      /* Opaque, not translucent: this bar sits over the thing being judged all
         the way down the page, and a blurred ghost of an avatar behind the
         title is exactly the kind of noise this page is trying to measure. */
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--chat);
        border-bottom: 1px solid var(--edge);
        padding: max(8px, env(safe-area-inset-top)) 16px 8px;
      }

      /* The title line stands down once you start scrolling — the toggles are
         what has to stay reachable, and every row it costs is a row of avatars
         the phone cannot show. */
      .titles {
        overflow: hidden;
        max-height: 64px;
        transition: max-height 0.2s ease, opacity 0.2s ease;
      }

      header[data-scrolled="1"] .titles {
        max-height: 0;
        opacity: 0;
      }

      h1 {
        font-size: 16px;
        letter-spacing: -0.01em;
      }

      .sub {
        color: var(--faint);
        font-size: 12px;
        margin-top: 1px;
      }

      .toggles {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .toggles button {
        flex: 1;
        min-height: 44px;
        border-radius: var(--r-pill);
        border: 1px solid var(--edge-strong);
        background: var(--raise2);
        color: var(--ink);
        font: 600 13px/1 var(--font-ui);
        cursor: pointer;
      }

      .toggles button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--chat);
        border-color: var(--ink);
      }

      main {
        padding: 16px;
        display: grid;
        gap: 16px;
        max-width: 720px;
        margin: 0 auto;
      }

      section {
        background: var(--side);
        border: 1px solid var(--edge);
        border-radius: var(--r-xl);
        padding: 16px;
        /* Anything scrolled to lands below the bar, not under it. */
        scroll-margin-top: 76px;
      }

      h2 {
        font-size: 15px;
        letter-spacing: -0.01em;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      h2 .n {
        font: 700 11px/1 var(--font-mono);
        color: var(--faint);
        border: 1px solid var(--edge-strong);
        border-radius: 6px;
        padding: 4px 5px;
      }

      .why {
        color: var(--dim);
        font-size: 13px;
        margin-top: 6px;
      }

      .lbl {
        font: 600 11px/1 var(--font-ui);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 18px 0 10px;
      }

      /* ---- the rows every candidate is shown through */
      .ramp {
        display: flex;
        align-items: flex-end;
        gap: 14px;
        flex-wrap: wrap;
      }

      .ramp figure {
        display: grid;
        justify-items: center;
        gap: 6px;
      }

      .ramp figcaption {
        font: 500 10px/1.3 var(--font-mono);
        color: var(--faint);
        text-align: center;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
        gap: 12px 8px;
      }

      .grid figure {
        display: grid;
        justify-items: center;
        gap: 5px;
      }

      .grid figcaption {
        font: 500 10px/1 var(--font-ui);
        color: var(--faint);
      }

      .states {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }

      .states figure {
        display: grid;
        justify-items: center;
        gap: 6px;
      }

      .states figcaption {
        font: 500 10px/1 var(--font-ui);
        color: var(--faint);
      }

      /* ---- verdict table against the issue's criteria */
      .verdict {
        margin-top: 16px;
        border-top: 1px solid var(--edge);
        padding-top: 12px;
        display: grid;
        gap: 6px;
      }

      .verdict div {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 8px;
        font-size: 12.5px;
        color: var(--dim);
      }

      .verdict b {
        font: 700 12px/1.35 var(--font-ui);
      }

      .yes {
        color: var(--ok);
      }
      .mid {
        color: var(--amber);
      }
      .no {
        color: var(--red);
      }

      /* ---- the stage: what the greyscale toggle filters */
      .stage.grey {
        filter: grayscale(1);
      }

      /* =====================================================================
         Shared avatar machinery.

         Every candidate is one span sized by --s, coloured by a .c-* class that
         sets a light and a deep tone. Nothing below reaches for a colour by
         name, so a ninth colour is a four-line addition.
         ===================================================================== */
      .av {
        width: var(--s, 44px);
        height: var(--s, 44px);
        flex: none;
        position: relative;
        display: block;
      }

      .c-teal {
        --lite: #6fe0c0;
        --deep: #2fb894;
        --deeper: #17705a;
      }
      .c-yellow {
        --lite: #ffd24d;
        --deep: #efa92f;
        --deeper: #8f6415;
      }
      .c-purple {
        --lite: #9c8cff;
        --deep: #6c55e8;
        --deeper: #3a2a8c;
      }
      .c-violet {
        --lite: #c08bff;
        --deep: #9257e8;
        --deeper: #55307f;
      }
      .c-blue {
        --lite: #6fafff;
        --deep: #3c7fe8;
        --deeper: #1d4a8f;
      }
      .c-orange {
        --lite: #ffa65c;
        --deep: #ef7e2f;
        --deeper: #8f4715;
      }
      .c-pink {
        --lite: #ff9bbb;
        --deep: #e85d8a;
        --deeper: #8c2a4a;
      }
      .c-green {
        --lite: #7adb8f;
        --deep: #3ea65c;
        --deeper: #1e6234;
      }

      /* The unread dot, unchanged from the app: top-right, red, one meaning. */
      .av .dot {
        position: absolute;
        top: -1px;
        right: -1px;
        width: max(9px, calc(var(--s) * 0.24));
        height: max(9px, calc(var(--s) * 0.24));
        border-radius: 50%;
        background: var(--red);
        border: max(2px, calc(var(--s) * 0.05)) solid var(--side);
        z-index: 2;
      }

      /* Status lives bottom-right and never borrows the dot's shape: running
         is a ring around the whole avatar, waiting is a bar-badge, failed is a
         cross-badge. Three silhouettes, so greyscale still tells them apart. */
      .av .st {
        position: absolute;
        right: -2px;
        bottom: -2px;
        width: max(11px, calc(var(--s) * 0.3));
        height: max(11px, calc(var(--s) * 0.3));
        border-radius: 50%;
        border: max(2px, calc(var(--s) * 0.05)) solid var(--side);
        display: grid;
        place-items: center;
        z-index: 2;
      }

      /* At the chat-header rung the two marks are a couple of pixels apart on
         the same rim; a nudge apiece gives the pair some air. */
      .av[data-compact="1"] .dot {
        top: -2px;
        right: 2px;
      }

      .av[data-compact="1"] .st {
        right: -3px;
        bottom: -3px;
      }

      .av .st svg {
        width: 74%;
        height: 74%;
        stroke: var(--on-color);
        stroke-width: 3.6;
        stroke-linecap: round;
        fill: none;
      }

      .av[data-state="waiting"] .st {
        background: var(--amber);
      }
      .av[data-state="failed"] .st {
        background: var(--red);
      }

      /* Running: a rotating arc *outside* the silhouette, so it reads at 28px
         where a badge glyph would not. It is a child rather than a pseudo
         because the blob candidates spend ::before and ::after on eyes. */
      .av .ring {
        position: absolute;
        inset: max(-4px, calc(var(--s) * -0.11));
        /* The avatar's own shape, one size up: a disc rings as a disc and a
           tile rings as a tile, instead of a circle cutting the tile's face. */
        border-radius: inherit;
        border: max(2px, calc(var(--s) * 0.055)) solid var(--ok);
        /* Three-quarters of a ring with one gap: it reads as "in progress"
           standing still, which is what a reduced-motion reader gets. */
        -webkit-mask: conic-gradient(
          from var(--spin, -0.05turn),
          #000 0 72%,
          transparent 72.5% 100%
        );
        mask: conic-gradient(
          from var(--spin, -0.05turn),
          #000 0 72%,
          transparent 72.5% 100%
        );
        animation: spin 1.6s linear infinite;
        z-index: 1;
      }

      /* Animating the gap's angle rather than rotating the box — a spinning
         rounded square would read as a broken tile. */
      @property --spin {
        syntax: "<angle>";
        inherits: false;
        initial-value: -18deg;
      }

      @keyframes spin {
        to {
          --spin: 342deg;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .av .ring {
          animation: none;
        }
      }

      .v2 .ring,
      .v3 .ring {
        border-radius: calc(var(--s) * 0.29 + 4px);
      }

      /* ---------------------------------------------------------------- v1
         Monogram blob — the blob keeps its silhouette, the eyes give way to
         the bot's initials. Identity stops being the palette's job.        */
      .v1 {
        border-radius: var(--wob, 52% 48% 55% 45% / 48% 54% 46% 52%);
        background: radial-gradient(circle at 32% 28%, var(--lite), var(--deep));
        display: grid;
        place-items: center;
        color: var(--on-color);
        font: 800 calc(var(--s) * 0.4) / 1 var(--font-ui);
        letter-spacing: -0.03em;
      }

      /* Below the inbox rung two letters turn to mush, so the ramp drops one.
         Same rule everywhere: the caller sets a size, the avatar decides. */
      .v1[data-compact="1"] {
        font-size: calc(var(--s) * 0.52);
        letter-spacing: 0;
      }

      /* ---------------------------------------------------------------- v2
         Glyph tile — .codeav's square, given a colour and a per-bot mark.
         The glyph is the name; colour is a second channel, not the only one. */
      .v2 {
        border-radius: calc(var(--s) * 0.29);
        background: linear-gradient(150deg, var(--lite), var(--deep));
        display: grid;
        place-items: center;
        color: var(--on-color);
      }

      .v2 svg {
        width: 58%;
        height: 58%;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---------------------------------------------------------------- v3
         Identicon — a 5×5 mirrored grid hashed from the bot's id. Nobody
         picks anything and no two names land on the same face.             */
      /* The clipped grid is an inner element: the status badge and the unread
         dot sit on the avatar's edge, and a container with overflow:hidden
         would eat both. Same reason .v5 clips its fill and not itself. */
      .v3 .cells {
        position: absolute;
        inset: 0;
        border-radius: calc(var(--s) * 0.29);
        overflow: hidden;
        background: var(--deeper);
        display: grid;
        grid-template: repeat(5, 1fr) / repeat(5, 1fr);
      }

      .v3 i.on {
        background: var(--lite);
      }

      /* ---------------------------------------------------------------- v4
         Refined blob — the face stays, the geometry stops being a percentage
         of a size that halves. The eyes have a pixel floor, which is the whole
         fix: at 28px they are 3.6 × 7.6, a face rather than two specks.      */
      .v4 {
        border-radius: var(--wob, 52% 48% 55% 45% / 48% 54% 46% 52%);
        background: radial-gradient(circle at 32% 28%, var(--lite), var(--deep));
      }

      /* Eye geometry is per-bot too — gap, height and tilt all hash from the
         id — because six border-radii were never going to separate two teal
         bots on their own. */
      .v4::before,
      .v4::after {
        content: "";
        position: absolute;
        top: var(--eyetop, 33%);
        width: max(3px, calc(var(--s) * 0.13));
        height: max(6px, calc(var(--s) * var(--eyeh, 0.27)));
        border-radius: max(1.5px, calc(var(--s) * 0.05));
        background: var(--on-color);
      }

      .v4::before {
        left: var(--gap, 28%);
        transform: rotate(var(--tilt, -8deg));
      }

      .v4::after {
        right: var(--gap, 28%);
        transform: rotate(calc(var(--tilt, -8deg) * -0.75));
      }

      /* ---------------------------------------------------------------- v5
         Shape-as-role — the silhouette says what kind of thing this is (disc
         = bot, cluster = crew, squircle = code session) and a fill pattern
         says which one, so identity survives the greyscale check.          */
      .v5 {
        border-radius: 50%;
      }

      .v5[data-shape="code"] {
        border-radius: calc(var(--s) * 0.29);
        display: grid;
        place-items: center;
      }

      .v5 svg {
        position: relative;
        width: 46%;
        height: 46%;
        fill: none;
        stroke: var(--on-color);
        stroke-width: 2.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Only the fill is clipped, so the badge on the rim survives. */
      .v5 .fill {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        overflow: hidden;
        background: var(--deep);
      }

      .v5[data-fill="solid"] .fill {
        background: radial-gradient(circle at 32% 28%, var(--lite), var(--deep));
      }

      .v5[data-fill="split"] .fill {
        background: linear-gradient(
          to right,
          var(--lite) 0 50%,
          var(--deeper) 50% 100%
        );
      }

      .v5[data-fill="ring"] .fill {
        background: var(--deeper);
        box-shadow: inset 0 0 0 max(3.5px, calc(var(--s) * 0.19)) var(--lite);
      }

      .v5[data-fill="band"] .fill {
        background: linear-gradient(
          to bottom,
          var(--lite) 0 33%,
          var(--deeper) 33% 67%,
          var(--lite) 67% 100%
        );
      }

      /* Both of these are sized in percentages, so the pattern has the same
         number of marks at 54px and at 28px instead of turning to moiré. */
      .v5[data-fill="dots"] .fill {
        background:
          radial-gradient(circle, var(--lite) 32%, transparent 34%) 0 0 / 50%
            50%,
          var(--deeper);
      }

      .v5[data-fill="chev"] .fill {
        background: repeating-linear-gradient(
          135deg,
          var(--lite) 0 22%,
          var(--deeper) 22% 44%
        );
      }

      /* Quadrants, not a square-in-a-circle: two opposite quarters go dark. */
      .v5[data-fill="quad"] .fill {
        background: conic-gradient(
          from 0turn,
          var(--lite) 0 25%,
          var(--deeper) 25% 50%,
          var(--lite) 50% 75%,
          var(--deeper) 75% 100%
        );
      }

      /* The crew, in each candidate's own vocabulary. */
      .cluster {
        width: var(--s, 44px);
        height: var(--s, 44px);
        flex: none;
        position: relative;
        display: block;
      }

      .cluster > i {
        position: absolute;
        display: block;
      }

      /* Three marks this close need a hairline of the surface between them or
         the lower two read as one wide mark with two glyphs in it. */
      .cluster > i > .av {
        box-shadow: 0 0 0 2px var(--side);
      }

      .cluster > .s1 {
        top: 0;
        left: 20%;
      }
      .cluster > .s2 {
        bottom: 0;
        left: 0;
      }
      .cluster > .s3 {
        bottom: 0;
        right: 0;
      }

      /* The code-session avatar as the app draws it today, for comparison. */
      .codeav {
        width: var(--s, 44px);
        height: var(--s, 44px);
        flex: none;
        border-radius: calc(var(--s) * 0.29);
        background: var(--raise);
        border: 1px solid var(--edge-strong);
        display: grid;
        place-items: center;
        color: var(--dim);
      }

      .codeav svg {
        width: 48%;
        height: 48%;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---- head-to-head strip */
      .h2h {
        display: grid;
        gap: 12px;
      }

      .h2h .row {
        display: flex;
        align-items: center;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      /* Four pairs do not fit across a phone at the Inbox rung, and the pairs
         are the evidence — so they wrap rather than scroll out of sight. */
      .h2h .row.wrap {
        flex-wrap: wrap;
        overflow-x: visible;
        row-gap: 8px;
      }

      .h2h .row.wrap + .row.wrap {
        margin-top: 6px;
        border-top: 1px solid var(--edge);
        padding-top: 10px;
      }

      .h2h .row b {
        font: 700 10px/1 var(--font-mono);
        color: var(--faint);
        width: 24px;
        flex: none;
      }

      /* Two bots that share a colour, kept close enough to be compared and far
         enough from the next pair to stay a pair. */
      .h2h .pair {
        display: flex;
        gap: 4px;
        flex: none;
      }

      .h2h .pair + .pair {
        margin-left: 12px;
      }

      .h2h .cap {
        font-size: 12px;
        color: var(--faint);
        white-space: nowrap;
      }

      .note {
        font-size: 12px;
        line-height: 1.4;
        color: var(--faint);
        margin-top: 10px;
      }

      /* ---- in-context strip: the chat header and an Inbox row */
      .ctx {
        display: grid;
        gap: 10px;
      }

      .ctx .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--raise2);
        border: 1px solid var(--edge);
        border-radius: var(--r-lg);
        padding: 9px 12px;
      }

      .ctx .t {
        font-size: 13.5px;
        font-weight: 600;
      }

      .ctx .m {
        font-size: 12px;
        color: var(--faint);
      }

      footer {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 16px;
        color: var(--faint);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header id="bar">
      <div class="titles">
        <h1>Bot avatars — five directions</h1>
        <div class="sub">
          Issue #44 · twelve bots, five sizes, four states, both themes
        </div>
      </div>
      <div class="toggles">
        <button id="t-grey" aria-pressed="false">Greyscale</button>
        <button id="t-theme" aria-pressed="false">Light</button>
        <button id="t-state" aria-pressed="true">States</button>
      </div>
    </header>

    <main class="stage" id="stage"></main>

    <footer>
      Sizes are the ones the shell actually asks for: 54 chief tile · 44 strip
      and crew card · 38 Inbox row · 30 editor swatch · 28 chat header.
    </footer>

    <script>
      // ---- the cast. Twelve bots against eight colours, so four of them are
      // colour collisions by construction — that is the point of the grid.
      const BOTS = [
        { id: "chief", name: "Chief of Staff", c: "c-teal", g: "flag" },
        { id: "scout", name: "Scout", c: "c-yellow", g: "search" },
        { id: "mira", name: "Mira", c: "c-purple", g: "spark" },
        { id: "atlas", name: "Atlas", c: "c-violet", g: "cube" },
        { id: "nova", name: "Nova", c: "c-blue", g: "star" },
        { id: "ember", name: "Ember", c: "c-orange", g: "flame" },
        { id: "pixel", name: "Pixel", c: "c-pink", g: "grid" },
        { id: "sage", name: "Sage", c: "c-green", g: "leaf" },
        { id: "vero", name: "Vero", c: "c-teal", g: "wave" },
        { id: "kilo", name: "Kilo", c: "c-yellow", g: "bolt" },
        { id: "juno", name: "Juno", c: "c-purple", g: "key" },
        { id: "rhea", name: "Rhea", c: "c-blue", g: "moon" },
      ];

      const SIZES = [
        [54, "54", "chief"],
        [44, "44", "strip"],
        [38, "38", "inbox"],
        [30, "30", "editor"],
        [28, "28", "header"],
      ];

      const STATES = [
        ["idle", "idle"],
        ["running", "running"],
        ["waiting", "waiting on you"],
        ["failed", "failed"],
      ];

      // ---- drawn, not imported. Same house as src/components/Icon.tsx.
      const GLYPH = {
        // A circle with a needle in it collapses to a coffee bean at 16px, so
        // the Chief gets the mark that still reads at the chat header: a flag.
        flag: '<path d="M6.5 21V4.5"/><path d="M6.5 5.5h11l-2.6 3.6 2.6 3.6h-11z" fill="currentColor" stroke-linejoin="round"/>',
        search: '<circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/>',
        spark:
          '<path d="M12 3c.6 5.4 3.6 8.4 9 9-5.4.6-8.4 3.6-9 9-.6-5.4-3.6-8.4-9-9 5.4-.6 8.4-3.6 9-9z" fill="currentColor" stroke-linejoin="round"/>',
        cube: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
        star: '<path d="M12 3.5l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.9l6-.8z"/>',
        flame: '<path d="M12 3c3 3.5 5.5 6 5.5 9.5A5.5 5.5 0 0 1 6.5 12.5C6.5 10 8 8.5 9 7c.6 1.6 1.4 2.3 2.2 2.6C11.4 7.6 11.4 5.3 12 3z"/>',
        grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/>',
        leaf: '<path d="M20 4C10 4 4 9 4 15a5 5 0 0 0 8.5 3.6C17 15 19 10 20 4z"/><path d="M8 18c2-5 5-8 9-10"/>',
        wave: '<path d="M3 9c2.5-3 4.5-3 7 0s4.5 3 7 0M3 15.5c2.5-3 4.5-3 7 0s4.5 3 7 0"/>',
        bolt: '<path d="M13.5 3L5.5 13.5h5L10 21l8.5-10.5h-5z"/>',
        key: '<circle cx="8" cy="12" r="4.2"/><path d="M12.2 12H21M17.5 12v3.6M20 12v2.6"/>',
        moon: '<path d="M19.5 14.5A8 8 0 0 1 9 4a8.2 8.2 0 1 0 10.5 10.5z"/>',
        terminal: '<path d="M6 8l4 4-4 4M12.5 16.5H18"/>',
      };

      const svg = (name) =>
        `<svg viewBox="0 0 24 24" aria-hidden="true">${GLYPH[name]}</svg>`;

      // Per-bot wobble and eye tilt, hashed from the id so the blob candidates
      // vary by bot rather than only by colour — eight radii for eight colours
      // was the ceiling the issue names.
      const hash = (s) => {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      };

      const WOBBLES = [
        "52% 48% 55% 45% / 48% 54% 46% 52%",
        "48% 52% 45% 55% / 54% 46% 56% 44%",
        "55% 45% 50% 50% / 45% 55% 48% 52%",
        "46% 54% 52% 48% / 55% 45% 52% 48%",
        "47% 53% 50% 50% / 53% 47% 55% 45%",
        "53% 47% 46% 54% / 47% 53% 50% 50%",
      ];

      // "Chief of Staff" is CS, not CO — the little words are not initials.
      const SKIP = new Set(["of", "the", "and", "for", "de", "von", "&"]);

      const initials = (name) => {
        const parts = name
          .split(/\s+/)
          .filter((w) => w && !SKIP.has(w.toLowerCase()));
        if (parts.length > 1)
          return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return name.slice(0, 2).toUpperCase();
      };

      // Below the Inbox rung the monogram drops to one letter, and one letter
      // is where Scout and Sage become the same mark. So the single letter is
      // the first one in the name nobody has taken yet — computed over the
      // roster, the way a crew of twelve is small enough to allow.
      const COMPACT_OF = (() => {
        const taken = new Set();
        const out = {};
        for (const b of BOTS) {
          const letters = (initials(b.name) + b.name.toUpperCase()).replace(
            /[^A-Z]/g,
            "",
          );
          const pick =
            [...letters].find((ch) => !taken.has(ch)) || letters[0];
          taken.add(pick);
          out[b.id] = pick;
        }
        return out;
      })();

      // v3: five columns mirrored around the middle one, filled from the hash.
      const identicon = (id) => {
        const h = hash(id);
        let cells = "";
        for (let r = 0; r < 5; r++) {
          const row = [];
          for (let c = 0; c < 3; c++) {
            const bit = (h >>> (r * 3 + c)) & 1;
            row[c] = bit;
          }
          // Keep at least one cell lit per row so no bot is a blank tile.
          if (!row.some(Boolean)) row[(h >>> r) % 3] = 1;
          const full = [row[0], row[1], row[2], row[1], row[0]];
          cells += full.map((b) => `<i class="${b ? "on" : ""}"></i>`).join("");
        }
        return cells;
      };

      // "solid" is the absence of a pattern, so it is dealt last: on a roster
      // of twelve exactly one bot draws it, and nobody else is pattern-free.
      const FILLS = [
        "split",
        "band",
        "ring",
        "quad",
        "dots",
        "chev",
        "solid",
      ];

      // Greyscale is the reason this is not a plain hash, and tone buckets
      // were not enough: the palette's whole greyscale spread is about 58
      // levels (purple 152 to yellow 210), so "light" and "dark" overlap and a
      // fill reused across them can land 3 levels apart. What actually
      // separates two bots sharing a fill is the distance between their greys,
      // so the roster is sorted by grey and the fills are dealt round-robin
      // down that order: the bots that share a pattern are seven seats apart,
      // which is the widest gap the palette can offer.
      const LITE = {
        "c-teal": "#6fe0c0",
        "c-yellow": "#ffd24d",
        "c-purple": "#9c8cff",
        "c-violet": "#c08bff",
        "c-blue": "#6fafff",
        "c-orange": "#ffa65c",
        "c-pink": "#ff9bbb",
        "c-green": "#7adb8f",
      };

      /** What `filter: grayscale(1)` will make of a colour. */
      const greyOf = (hex) => {
        const n = parseInt(hex.slice(1), 16);
        return (
          0.2126 * ((n >> 16) & 255) +
          0.7152 * ((n >> 8) & 255) +
          0.0722 * (n & 255)
        );
      };

      const FILL_OF = (() => {
        const out = {};
        const order = [...BOTS].sort(
          (a, b) => greyOf(LITE[a.c]) - greyOf(LITE[b.c]),
        );
        order.forEach((b, i) => {
          out[b.id] = FILLS[i % FILLS.length];
        });
        return out;
      })();

      const badge = (state) => {
        if (state === "running") return '<span class="ring"></span>';
        if (state === "waiting")
          return `<span class="st"><svg viewBox="0 0 24 24"><path d="M12 6v7"/><path d="M12 17.5v.2"/></svg></span>`;
        if (state === "failed")
          return `<span class="st"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></span>`;
        return "";
      };

      // ---- one function per candidate, all with the same signature so the
      // rows below can be generated once and reused five times.
      function avatar(kind, bot, size, opts = {}) {
        const { state = "idle", unread = false, shape = "bot" } = opts;
        const compact = size <= 30 ? "1" : "0";
        const wob = WOBBLES[hash(bot.id) % WOBBLES.length];
        const tilt = -14 + (hash(bot.id + "t") % 5) * 7;
        const gap = 23 + (hash(bot.id + "g") % 4) * 4;
        const eyeh = (0.22 + (hash(bot.id + "h") % 4) * 0.045).toFixed(3);
        const eyetop = 29 + (hash(bot.id + "y") % 3) * 3;
        const chrome =
          (unread ? '<span class="dot"></span>' : "") + badge(state);
        const attrs = `style="--s:${size}px;--wob:${wob};--tilt:${tilt}deg;--gap:${gap}%;--eyeh:${eyeh};--eyetop:${eyetop}%" data-state="${state}" data-compact="${compact}"`;
        const title = `title="${bot.name}"`;

        if (kind === "v1")
          return `<span class="av v1 ${bot.c}" ${attrs} ${title}>${
            compact === "1" ? COMPACT_OF[bot.id] : initials(bot.name)
          }${chrome}</span>`;

        if (kind === "v2")
          return `<span class="av v2 ${bot.c}" ${attrs} ${title}>${svg(
            bot.g,
          )}${chrome}</span>`;

        if (kind === "v3")
          return `<span class="av v3 ${bot.c}" ${attrs} ${title}><span class="cells">${identicon(
            bot.id,
          )}</span>${chrome}</span>`;

        if (kind === "v4")
          return `<span class="av v4 ${bot.c}" ${attrs} ${title}>${chrome}</span>`;

        const fill = FILL_OF[bot.id] || FILLS[hash(bot.id + "f") % FILLS.length];
        // The code session keeps the terminal mark the app draws today — the
        // squircle says "not a bot", the prompt says what kind of not-a-bot.
        const mark = shape === "code" ? svg("terminal") : "";
        return `<span class="av v5 ${bot.c}" ${attrs} data-fill="${fill}" data-shape="${shape}" ${title}><span class="fill"></span>${mark}${chrome}</span>`;
      }

      // ---- rows
      const rampRow = (kind, bot) =>
        `<div class="ramp">${SIZES.map(
          ([px, n, where]) =>
            `<figure>${avatar(kind, bot, px)}<figcaption>${n}<br />${where}</figcaption></figure>`,
        ).join("")}</div>`;

      const gridRow = (kind) =>
        `<div class="grid">${BOTS.map(
          (b) =>
            `<figure>${avatar(kind, b, 38)}<figcaption>${b.name.split(" ")[0]}</figcaption></figure>`,
        ).join("")}</div>`;

      const stateRow = (kind) =>
        `<div class="states">${STATES.map(
          ([s, label], i) =>
            `<figure>${avatar(kind, BOTS[i + 1], 44, {
              state: s,
              // Failed carries the dot too: red badge under red dot is
              // the one pairing that has to be looked at, not assumed.
              unread: s === "waiting" || s === "failed",
            })}<figcaption>${label}</figcaption></figure>`,
        ).join("")}<figure>${avatar(kind, BOTS[5], 28, {
          state: "failed",
          unread: true,
        })}<figcaption>failed · 28</figcaption></figure></div>`;

      // Bot / crew / code session in each candidate's own grammar.
      // Three of the candidate's own marks, not three blobs — the crew is the
      // one avatar that is not a single bot, and it should still be built out
      // of whatever the candidate says a bot looks like.
      const crewOf = (kind) => {
        const trio = [BOTS[0], BOTS[2], BOTS[3]];
        return `<span class="cluster" style="--s:44px">${trio
          .map((b, i) => `<i class="s${i + 1}">${avatar(kind, b, 25)}</i>`)
          .join("")}</span>`;
      };

      const roleRow = (kind) => {
        const bot = avatar(kind, BOTS[0], 44);
        const crew = crewOf(kind);
        const code =
          kind === "v5"
            ? avatar(kind, BOTS[3], 44, { shape: "code" })
            : `<span class="codeav" style="--s:44px">${svg("terminal")}</span>`;
        return `<div class="states">
          <figure>${bot}<figcaption>bot</figcaption></figure>
          <figure>${crew}<figcaption>crew</figcaption></figure>
          <figure>${code}<figcaption>code session</figcaption></figure>
        </div>`;
      };

      const ctxRow = (kind) => `<div class="ctx">
        <div class="bar">${avatar(kind, BOTS[2], 28)}<div><div class="t">Mira</div></div><div class="m" style="margin-left:auto">chat header · 28</div></div>
        <div class="bar">${avatar(kind, BOTS[5], 38, { unread: true })}<div><div class="t">Ember</div><div class="m">Deploy finished — two checks red</div></div></div>
      </div>`;

      const CANDIDATES = [
        {
          kind: "v1",
          title: "Monogram blob",
          why: "The blob keeps its silhouette; the eyes give way to the bot's initials. Identity stops depending on the palette, and the ramp drops to one letter below the Inbox rung so 28px stays legible.",
          verdict: [
            ["yes", "Sizes", "One letter at 30/28 is still a shape, not noise."],
            ["yes", "Greyscale", "Letters carry it; hue is decoration."],
            [
              "mid",
              "Beyond eight",
              "676 pairs at 38px and up — but the 28px rung has 26 letters, so the single letter has to be picked against the crew.",
            ],
            ["yes", "Status", "Ring for running, badge bottom-right, dot stays top-right."],
            ["mid", "Cost", "Loses the face — the crew stops looking like characters."],
          ],
        },
        {
          kind: "v2",
          title: "Glyph tile",
          why: "The code session's square, given a colour and a per-bot mark from the drawn icon set. The glyph is the name; colour is the second channel.",
          verdict: [
            ["yes", "Sizes", "A 58% glyph at 28px is ~16px — the size the app already ships icons at."],
            ["yes", "Greyscale", "Silhouette is the whole signal."],
            ["mid", "Beyond eight", "Bounded by how many marks stay distinct — 12–16 before they blur."],
            ["yes", "Status", "Same ring and badge; the tile has corners to spare."],
            ["mid", "Cost", "Somebody has to pick a glyph per bot, and bots now look like apps."],
          ],
        },
        {
          kind: "v3",
          title: "Generative identicon",
          why: "A 5×5 mirrored grid hashed from the bot id. Nobody picks anything, every bot is distinct, and a rename is a new face — which is either the feature or the bug.",
          verdict: [
            ["mid", "Sizes", "At 28px each cell is 5.6px; the pattern reads as texture, not shape."],
            ["yes", "Greyscale", "Two tones per tile, pattern does the work."],
            ["yes", "Beyond eight", "2^15 patterns off the id — effectively unbounded, no picking, no roster to check."],
            ["yes", "Status", "Unchanged; the tile edge is free."],
            ["no", "Cost", "Impersonal, and the face is not stable across a rename."],
          ],
        },
        {
          kind: "v4",
          title: "Refined blob",
          why: "Keep the face, fix the geometry: the eyes get a pixel floor instead of a percentage of a shrinking box, so at 28px they are 3.6 × 7.6 rather than two specks. Wobble, eye gap, eye height and tilt now hash from the id, so two teal bots are not the same blob.",
          verdict: [
            ["yes", "Sizes", "The pixel floor, not a percentage, is what keeps 28px a face."],
            [
              "no",
              "Greyscale",
              "Look at the twelve above with colour off: wobble and eye tilt are a whisper, not a channel.",
            ],
            [
              "mid",
              "Beyond eight",
              "Six wobbles × five tilts × four eye gaps, but the differences want a side-by-side to see.",
            ],
            ["yes", "Status", "Ring reads well against a round silhouette."],
            ["yes", "Cost", "Smallest diff of the five; the product still looks like itself."],
          ],
        },
        {
          kind: "v5",
          title: "Shape-as-role sigil",
          why: "Silhouette says what kind of thing this is — disc for a bot, cluster for the crew, squircle for a code session — and a fill pattern says which one. Colour becomes the third channel, not the only one.",
          verdict: [
            ["yes", "Sizes", "Patterns are half-and-quarter divisions; they survive 28px."],
            ["yes", "Greyscale", "Light/dark tone split is a luminance channel."],
            [
              "mid",
              "Beyond eight",
              "7 fills × 8 colours = 56 in colour. In greyscale the fills repeat past seven bots — the repeat is placed at the widest grey gap the palette has, which is 39 of 255.",
            ],
            ["mid", "Status", "The running ring reads twice on a ring fill; it wants an offset."],
            ["mid", "Cost", "New grammar to learn, and no face at all."],
          ],
        },
      ];

      const MARK = { yes: "✓", mid: "~", no: "✗" };

      const section = (c, i) => `<section>
        <h2><span class="n">0${i + 1}</span>${c.title}</h2>
        <p class="why">${c.why}</p>
        <div class="lbl">Size ramp</div>
        ${rampRow(c.kind, BOTS[0])}
        <div class="lbl">Twelve bots, eight colours</div>
        ${gridRow(c.kind)}
        <div class="lbl">Status &amp; unread</div>
        ${stateRow(c.kind)}
        <p class="note">
          Idle draws nothing on purpose — most bots are idle most of the time.
          The red dot keeps the top-right corner and means unread; status takes
          the bottom-right, and running takes the rim. The last two carry both
          at once: failed under unread is red on red, which is the pairing to
          judge rather than assume.
        </p>
        <div class="lbl">Bot · crew · code session</div>
        ${roleRow(c.kind)}
        <div class="lbl">In place</div>
        ${ctxRow(c.kind)}
        <div class="verdict">${c.verdict
          .map(
            ([m, k, t]) =>
              `<div><span class="${m}">${MARK[m]}</span><span><b>${k}.</b> ${t}</span></div>`,
          )
          .join("")}</div>
      </section>`;

      // The four pairs the palette forces to share a colour, and the pair the
      // monogram forces to share a letter. This is the whole test.
      const COLLISIONS = [
        [0, 8],
        [1, 9],
        [2, 10],
        [4, 11],
      ];

      const headToHead = () => `<section>
        <h2><span class="n">vs</span>Head to head</h2>
        <p class="why">
          The rungs that decide it: the chat header, and the four pairs of bots
          the eight-colour palette forces to share a colour. If two bots in a
          pair read as one bot, that candidate has not solved the problem the
          issue opens with.
        </p>
        <div class="lbl">Chief of Staff at 28px</div>
        <div class="h2h"><div class="row">${CANDIDATES.map(
          (c) => `<span>${avatar(c.kind, BOTS[0], 28)}</span>`,
        ).join("")}</div></div>
        <div class="lbl">All four colour collisions at 38px</div>
        <div class="h2h">${CANDIDATES.map(
          (c) =>
            `<div class="row wrap"><b>${c.kind}</b>${COLLISIONS.map(
              ([a, z]) =>
                `<span class="pair">${avatar(c.kind, BOTS[a], 38)}${avatar(
                  c.kind,
                  BOTS[z],
                  38,
                )}</span>`,
            ).join("")}</div>`,
        ).join("")}</div>
        <p class="note">
          In reading order: Chief/Vero teal · Scout/Kilo yellow · Mira/Juno purple
          · Nova/Rhea blue. Turn on greyscale and run the row again.
        </p>
        <div class="lbl">Two S names at 28px — Scout vs Sage</div>
        <div class="h2h">${CANDIDATES.map(
          (c) =>
            `<div class="row"><b>${c.kind}</b><span class="pair">${avatar(
              c.kind,
              BOTS[1],
              28,
            )}${avatar(c.kind, BOTS[7], 28)}</span><span class="cap">${
              c.title
            }</span></div>`,
        ).join("")}</div>
        <p class="note">
          The monogram's worst case: at 28px it is down to one letter, so Scout
          and Sage would both be "S" unless the letter is picked against the
          rest of the crew. Here Sage takes its first free letter instead.
        </p>
      </section>`;

      const stage = document.getElementById("stage");
      stage.innerHTML =
        CANDIDATES.map(section).join("") + headToHead();

      // ---- toggles
      const grey = document.getElementById("t-grey");
      const theme = document.getElementById("t-theme");
      const state = document.getElementById("t-state");

      grey.addEventListener("click", () => {
        const on = grey.getAttribute("aria-pressed") === "true";
        grey.setAttribute("aria-pressed", String(!on));
        stage.classList.toggle("grey", !on);
      });

      theme.addEventListener("click", () => {
        const on = theme.getAttribute("aria-pressed") === "true";
        theme.setAttribute("aria-pressed", String(!on));
        document.documentElement.dataset.theme = on ? "dark" : "light";
      });

      const bar = document.getElementById("bar");
      addEventListener(
        "scroll",
        () => {
          bar.dataset.scrolled = scrollY > 24 ? "1" : "0";
        },
        { passive: true },
      );

      state.addEventListener("click", () => {
        const on = state.getAttribute("aria-pressed") === "true";
        state.setAttribute("aria-pressed", String(!on));
        stage.querySelectorAll(".dot, .st, .ring").forEach((el) => {
          el.style.display = on ? "none" : "";
        });
        stage.querySelectorAll(".av").forEach((el) => {
          if (on) {
            el.dataset.keep = el.dataset.state;
            el.dataset.state = "idle";
          } else if (el.dataset.keep) {
            el.dataset.state = el.dataset.keep;
          }
        });
      });
    </script>
  </body>
</html>
