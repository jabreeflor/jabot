<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>JaBot avatar characters</title>
    <!--
      Round two of #44. The first page (jabot-avatars.html) answered the issue's
      five criteria and produced five identity *systems* — monograms, tiles,
      hashed grids, fill patterns. They pass every test and none of them is
      anybody. Candidate 01 over there says so in its own cost row: "loses the
      face — the crew stops looking like characters."

      This page starts from the opposite end. The rule animators use on a
      character is the silhouette test: black it out, and if you cannot tell who
      it is, the design has failed. That is the same test as greyscale at 28px.
      So character is not the thing you trade the criteria away for — it is
      another way of passing them, and the one that gives you a crew you want
      to name.

      Same rows as the systems page, so the two can be compared: five size
      rungs (54 / 44 / 38 / 30 / 28), twelve bots against eight colours, the
      four run states, bot / crew / code session, and the greyscale and light
      checks.

      One thing is deliberately different. Over there, state was a badge stuck
      on the rim. Here the face has the state: a bot that needs you looks at
      you, a bot that failed has its eyes screwed shut. The badge is what you
      do when the avatar cannot emote. These can.
    -->
    <style>
      /* ---- tokens: the app's dark palette, plus a light theme for the check */
      :root {
        --win: #1c1c1e;
        --side: #1c1c1e;
        --chat: #151516;
        --raise: #2a2a2c;
        --raise2: #232325;
        --ink: #f2f2f2;
        --dim: #98989e;
        --faint: #8e8e93;
        --edge: #303033;
        --edge-strong: #37373a;
        --amber: #e8a33d;
        --red: #ff453a;
        --ok: #5dbb6e;
        --font-ui:
          -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
        --r-lg: 12px;
        --r-xl: 16px;
        --r-pill: 99px;
        --on-color: #14141a;
      }

      html[data-theme="light"] {
        --win: #f6f6f4;
        --side: #ffffff;
        --chat: #efeeec;
        --raise: #ffffff;
        --raise2: #f4f3f1;
        --ink: #1c1c1e;
        --dim: #5c5c63;
        --faint: #6e6e73;
        --edge: #dcdbd8;
        --edge-strong: #c9c8c4;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: var(--chat);
        color: var(--ink);
        font: 15px/1.45 var(--font-ui);
        -webkit-font-smoothing: antialiased;
        padding: 0 0 64px;
      }

      /* ---- chrome */
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--chat);
        border-bottom: 1px solid var(--edge);
        padding: max(8px, env(safe-area-inset-top)) 16px 8px;
      }

      .titles {
        overflow: hidden;
        max-height: 64px;
        transition:
          max-height 0.2s ease,
          opacity 0.2s ease;
      }

      header[data-scrolled="1"] .titles {
        max-height: 0;
        opacity: 0;
      }

      h1 {
        font-size: 16px;
        letter-spacing: -0.01em;
      }

      .sub {
        color: var(--faint);
        font-size: 12px;
        margin-top: 1px;
      }

      .toggles {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .toggles button {
        flex: 1;
        min-height: 44px;
        border-radius: var(--r-pill);
        border: 1px solid var(--edge-strong);
        background: var(--raise2);
        color: var(--ink);
        font: 600 13px/1 var(--font-ui);
        cursor: pointer;
      }

      .toggles button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--chat);
        border-color: var(--ink);
      }

      main {
        padding: 16px;
        display: grid;
        gap: 16px;
        max-width: 720px;
        margin: 0 auto;
      }

      section {
        background: var(--side);
        border: 1px solid var(--edge);
        border-radius: var(--r-xl);
        padding: 16px;
        scroll-margin-top: 76px;
      }

      h2 {
        font-size: 15px;
        letter-spacing: -0.01em;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      h2 .n {
        font: 700 11px/1 var(--font-mono);
        color: var(--faint);
        border: 1px solid var(--edge-strong);
        border-radius: 6px;
        padding: 4px 5px;
      }

      .why {
        color: var(--dim);
        font-size: 13px;
        margin-top: 6px;
      }

      .lbl {
        font: 600 11px/1 var(--font-ui);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 18px 0 10px;
      }

      .note {
        font-size: 12px;
        line-height: 1.4;
        color: var(--faint);
        margin-top: 10px;
      }

      /* ---- the rows every candidate is shown through */
      .ramp {
        display: flex;
        align-items: flex-end;
        gap: 14px;
        flex-wrap: wrap;
      }

      .ramp figure,
      .grid figure,
      .states figure {
        display: grid;
        justify-items: center;
        gap: 6px;
      }

      .ramp figcaption {
        font: 500 10px/1.3 var(--font-mono);
        color: var(--faint);
        text-align: center;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
        gap: 14px 8px;
      }

      .grid figcaption,
      .states figcaption {
        font: 500 10px/1 var(--font-ui);
        color: var(--faint);
      }

      .states {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }

      .verdict {
        margin-top: 16px;
        border-top: 1px solid var(--edge);
        padding-top: 12px;
        display: grid;
        gap: 6px;
      }

      .verdict div {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 8px;
        font-size: 12.5px;
        color: var(--dim);
      }

      .verdict b {
        font: 700 12px/1.35 var(--font-ui);
      }

      .yes {
        color: var(--ok);
      }
      .mid {
        color: var(--amber);
      }
      .no {
        color: var(--red);
      }

      .stage.grey {
        filter: grayscale(1);
      }

      /* =====================================================================
         Shared machinery. Every character is one span sized by --s and
         coloured by a .c-* class. The drawing inside is a 24x24 SVG, so a
         character is the same character at 54px and at 28px — no percentage
         of a shrinking box to go wrong.
         ===================================================================== */
      .av {
        width: var(--s, 44px);
        height: var(--s, 44px);
        flex: none;
        position: relative;
        display: block;
      }

      .av > svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .c-teal {
        --lite: #6fe0c0;
        --deep: #2fb894;
        --deeper: #17705a;
      }
      .c-yellow {
        --lite: #ffd24d;
        --deep: #efa92f;
        --deeper: #8f6415;
      }
      .c-purple {
        --lite: #9c8cff;
        --deep: #6c55e8;
        --deeper: #3a2a8c;
      }
      .c-violet {
        --lite: #c08bff;
        --deep: #9257e8;
        --deeper: #55307f;
      }
      .c-blue {
        --lite: #6fafff;
        --deep: #3c7fe8;
        --deeper: #1d4a8f;
      }
      .c-orange {
        --lite: #ffa65c;
        --deep: #ef7e2f;
        --deeper: #8f4715;
      }
      .c-pink {
        --lite: #ff9bbb;
        --deep: #e85d8a;
        --deeper: #8c2a4a;
      }
      .c-green {
        --lite: #7adb8f;
        --deep: #3ea65c;
        --deeper: #1e6234;
      }

      /* The unread dot, unchanged: top-right, red, one meaning. */
      .av .dot {
        position: absolute;
        top: -1px;
        right: 1px;
        width: max(9px, calc(var(--s) * 0.24));
        height: max(9px, calc(var(--s) * 0.24));
        border-radius: 50%;
        background: var(--red);
        border: max(2px, calc(var(--s) * 0.05)) solid var(--rim, var(--side));
        z-index: 3;
      }

      /* The hat owns the top of the mark, so the dot takes the shoulder. */
      .av.m2 .dot {
        top: 28%;
        right: -3px;
      }

      /* Running still gets a rim, because "working" is a thing you glance at
         rather than read. Everything else is the face's job. */
      .av .ring {
        position: absolute;
        inset: max(-4px, calc(var(--s) * -0.12));
        border-radius: 50%;
        border: max(2px, calc(var(--s) * 0.055)) solid var(--ok);
        -webkit-mask: conic-gradient(
          from var(--spin, -0.05turn),
          #000 0 72%,
          transparent 72.5% 100%
        );
        mask: conic-gradient(
          from var(--spin, -0.05turn),
          #000 0 72%,
          transparent 72.5% 100%
        );
        animation: spin 1.6s linear infinite;
        z-index: 1;
      }

      @property --spin {
        syntax: "<angle>";
        inherits: false;
        initial-value: -18deg;
      }

      @keyframes spin {
        to {
          --spin: 342deg;
        }
      }

      /* Ink for eyes and mouths, and the two paints a body is made of. */
      .body {
        fill: var(--deep);
      }
      .belly {
        fill: var(--lite);
      }
      .ink {
        fill: var(--on-color);
      }
      .inkstroke {
        fill: none;
        stroke: var(--on-color);
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .litefill {
        fill: var(--lite);
        stroke: var(--on-color);
        stroke-width: 1.2;
        stroke-linejoin: round;
      }

      /* A blink is the cheapest possible sign of life: the eyes close for
         120ms every few seconds, each bot on its own clock. */
      .eyes {
        transform-box: fill-box;
        transform-origin: center;
        animation: blink 6s infinite;
        animation-delay: var(--blink, 0s);
      }

      @keyframes blink {
        0%,
        96%,
        100% {
          transform: scaleY(1);
        }
        98% {
          transform: scaleY(0.08);
        }
      }

      /* A bot that is working breathes; one that needs you leans in. */
      .av[data-state="running"] .rig {
        animation: bob 1.8s ease-in-out infinite;
      }

      .av[data-state="waiting"] .rig {
        animation: lean 2.4s ease-in-out infinite;
      }

      @keyframes bob {
        50% {
          transform: translateY(-0.7px);
        }
      }

      @keyframes lean {
        50% {
          transform: scale(1.04);
        }
      }

      .rig {
        transform-box: fill-box;
        transform-origin: center;
      }

      @media (prefers-reduced-motion: reduce) {
        .eyes,
        .ring,
        .av .rig {
          animation: none;
        }
      }

      /* ---- 04 pixel pets: crisp squares, no smoothing at any size */
      .px rect {
        shape-rendering: crispEdges;
      }

      .px .tile {
        fill: var(--deeper);
      }

      /* ---- 05 watchers: pupils that follow the page */
      .pupil {
        fill: var(--on-color);
        transform: translate(
          calc(var(--gx, 0) * 1px),
          calc(var(--gy, 0) * 1px)
        );
        transition: transform 0.25s ease-out;
      }

      /* A bot that needs you stops looking around and looks at you. */
      .av[data-state="waiting"] .pupil {
        transform: none;
      }

      .sclera {
        fill: #fbfbf8;
        stroke: var(--on-color);
        stroke-width: 0.9;
      }

      /* ---- the crew: three of the candidate's own characters */
      .cluster {
        width: var(--s, 44px);
        height: var(--s, 44px);
        flex: none;
        position: relative;
        display: block;
      }

      .cluster > i {
        position: absolute;
        display: block;
      }

      .cluster > i > .av {
        filter: drop-shadow(0 0 1.5px var(--rim, var(--side)))
          drop-shadow(0 0 1.5px var(--rim, var(--side)));
      }

      .cluster > .s1 {
        top: 0;
        left: 20%;
      }
      .cluster > .s2 {
        bottom: 0;
        left: 0;
      }
      .cluster > .s3 {
        bottom: 0;
        right: 0;
      }

      /* The code session: still not a face, on purpose. */
      .codeav {
        width: var(--s, 44px);
        height: var(--s, 44px);
        flex: none;
        border-radius: calc(var(--s) * 0.29);
        background: var(--raise);
        border: 1px solid var(--edge-strong);
        display: grid;
        place-items: center;
        color: var(--dim);
      }

      .codeav svg {
        width: 48%;
        height: 48%;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---- head-to-head */
      .h2h {
        display: grid;
        gap: 12px;
      }

      .h2h .row {
        display: flex;
        align-items: center;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .h2h .row.wrap {
        flex-wrap: wrap;
        overflow-x: visible;
        row-gap: 8px;
      }

      .h2h .row.wrap + .row.wrap {
        margin-top: 6px;
        border-top: 1px solid var(--edge);
        padding-top: 10px;
      }

      .h2h .row b {
        font: 700 10px/1 var(--font-mono);
        color: var(--faint);
        width: 24px;
        flex: none;
      }

      .h2h .pair {
        display: flex;
        gap: 4px;
        flex: none;
      }

      .h2h .pair + .pair {
        margin-left: 12px;
      }

      .h2h .cap {
        font-size: 12px;
        color: var(--faint);
        white-space: nowrap;
      }

      /* ---- in place */
      .ctx {
        display: grid;
        gap: 10px;
      }

      .ctx .bar {
        --rim: var(--raise2);
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--raise2);
        border: 1px solid var(--edge);
        border-radius: var(--r-lg);
        padding: 9px 12px;
      }

      .ctx .t {
        font-size: 13.5px;
        font-weight: 600;
      }

      .ctx .m {
        font-size: 12px;
        color: var(--faint);
      }

      footer {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 16px;
        color: var(--faint);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header id="bar">
      <div class="titles">
        <h1>Bot avatars — five characters</h1>
        <div class="sub">
          Issue #44, round two · the crew as creatures, not as a naming scheme
        </div>
      </div>
      <div class="toggles">
        <button id="t-grey" aria-pressed="false">Greyscale</button>
        <button id="t-theme" aria-pressed="false">Light</button>
        <button id="t-state" aria-pressed="true">States</button>
      </div>
    </header>

    <main class="stage" id="stage"></main>

    <footer>
      The silhouette test and the 28px test are the same test: black out a
      character, and if you cannot tell who it is, it was never a character.
      Scroll with Greyscale on — that is the blacked-out version.
    </footer>

    <script>
      // ---- the cast. Twelve bots against eight colours, so four pairs are
      // forced onto the same colour — the same test the systems page runs.
      const BOTS = [
        { id: "chief", name: "Chief of Staff", c: "c-teal" },
        { id: "scout", name: "Scout", c: "c-yellow" },
        { id: "mira", name: "Mira", c: "c-purple" },
        { id: "atlas", name: "Atlas", c: "c-violet" },
        { id: "nova", name: "Nova", c: "c-blue" },
        { id: "ember", name: "Ember", c: "c-orange" },
        { id: "pixel", name: "Pixel", c: "c-pink" },
        { id: "sage", name: "Sage", c: "c-green" },
        { id: "vero", name: "Vero", c: "c-teal" },
        { id: "kilo", name: "Kilo", c: "c-yellow" },
        { id: "juno", name: "Juno", c: "c-purple" },
        { id: "rhea", name: "Rhea", c: "c-blue" },
      ];

      const SIZES = [
        [54, "54", "chief"],
        [44, "44", "strip"],
        [38, "38", "inbox"],
        [30, "30", "editor"],
        [28, "28", "header"],
      ];

      const STATES = [
        ["idle", "idle"],
        ["running", "running"],
        ["waiting", "waiting on you"],
        ["failed", "failed"],
      ];

      const hash = (s) => {
        let h = 2166136261;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      };

      const pick = (arr, id, salt) => arr[hash(id + salt) % arr.length];

      const svg = (inner, cls = "") =>
        `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true">${inner}</svg>`;

      // =====================================================================
      // Faces. The same vocabulary serves 01, 03 and 05, because a face is the
      // part every one of them has — what differs is what it is attached to.
      // =====================================================================
      const EYE = {
        round: '<circle cx="8.6" cy="11.4" r="2.2"/><circle cx="15.4" cy="11.4" r="2.2"/>',
        tall: '<ellipse cx="8.7" cy="11.4" rx="1.7" ry="2.8"/><ellipse cx="15.3" cy="11.4" rx="1.7" ry="2.8"/>',
        beady:
          '<circle cx="7.7" cy="11.2" r="1.4"/><circle cx="16.3" cy="11.2" r="1.4"/>',
        sleepy:
          '<path d="M6.3 11.8a2.3 2.3 0 0 1 4.6 0z"/><path d="M13.1 11.8a2.3 2.3 0 0 1 4.6 0z"/>',
        wide: '<circle cx="8.4" cy="11.2" r="3"/><circle cx="15.6" cy="11.2" r="3"/>',
        oval: '<ellipse cx="8.5" cy="11.4" rx="2.5" ry="1.9"/><ellipse cx="15.5" cy="11.4" rx="2.5" ry="1.9"/>',
      };

      const EYE_KEYS = Object.keys(EYE);

      // State overrides the bot's own eyes: a face is worth having because it
      // can say something the rim cannot.
      const EYES_FOR = (bot, state, browed = true) => {
        if (state === "running")
          // squinting at the work
          return '<path class="inkstroke" d="M6.4 12.2q2.2-2.6 4.4 0"/><path class="inkstroke" d="M13.2 12.2q2.2-2.6 4.4 0"/>';
        if (state === "failed")
          return '<path class="inkstroke" d="M6.6 9.8l3.6 3.4M10.2 9.8l-3.6 3.4"/><path class="inkstroke" d="M13.8 9.8l3.6 3.4M17.4 9.8l-3.6 3.4"/>';
        if (state === "waiting") {
          // Eyes up and open. The brows are the tell, but under a brim they
          // fuse into one black slab, so a hatted head raises its eyes only.
          const eyes =
            '<circle class="ink" cx="8.4" cy="11.4" r="2.9"/><circle class="ink" cx="15.6" cy="11.4" r="2.9"/>';
          const brows =
            '<path class="inkstroke" d="M6.2 7.7q2.4-1.4 4.8-.3"/><path class="inkstroke" d="M17.8 7.7q-2.4-1.4-4.8-.3"/>';
          return browed === false ? eyes : eyes + brows;
        }
        return `<g class="ink">${EYE[pick(EYE_KEYS, bot.id, "e")]}</g>`;
      };

      const MOUTH_FOR = (bot, state) => {
        if (state === "running")
          return '<path class="inkstroke" d="M10.4 16.2q1.6 1.4 3.2 0"/>';
        if (state === "waiting")
          return '<circle class="ink" cx="12" cy="16.6" r="1.5"/>';
        if (state === "failed")
          return '<path class="inkstroke" d="M10.2 17.2q1.8-1.8 3.6 0"/>';
        const m = pick(
          [
            '<path class="inkstroke" d="M10.6 16q1.4 1.1 2.8 0"/>',
            '<path class="inkstroke" d="M10.8 16.2h2.4"/>',
            '<path class="inkstroke" d="M10.6 16.4q1.4-1 2.8 0"/>',
          ],
          bot.id,
          "m",
        );
        return m;
      };

      // =====================================================================
      // 01 Moodblob — the blob we already ship, with a face that answers.
      // =====================================================================
      // Four postures rather than four rounding errors: tall, squat, and one
      // leaning each way. A blob's outline is the only thing it has, so it had
      // better be doing some work.
      const WOBBLE = [
        // tall
        "M12 2.4c4.7 0 7.9 3.4 7.9 9.4s-2.9 9.8-7.9 9.8-7.9-3.8-7.9-9.8 3.2-9.4 7.9-9.4z",
        // squat
        "M12 5c6.2 0 9.4 3 9.4 8s-3.2 8.4-9.4 8.4S2.6 18 2.6 13 5.8 5 12 5z",
        // leaning left
        "M11.2 3c5.4 0 9 3.6 9 8.8s-3.8 9.6-9.4 9.6-7.5-4.2-7.5-9.4S5.8 3 11.2 3z",
        // leaning right
        "M12.8 3c5.4 0 8.1 4 8.1 9.2s-1.9 9.2-7.5 9.2-9.4-4.4-9.4-9.6S7.4 3 12.8 3z",
        // pear
        "M12 3c4.4 0 7 3 7 7.4 0 4-3 4.6-3 7.2 0 2.2-1.6 3.6-4 3.6s-4-1.4-4-3.6c0-2.6-3-3.2-3-7.2C5 6 7.6 3 12 3z",
      ];

      const TUFT = [
        '<path class="body" d="M11.4 3.6c-.2-2 .8-3.2 2.2-3.4-.4 1.6.2 2.4 1 3z"/>',
        '<path class="body" d="M11.6 3.4c-1.4-1.4-1.2-2.8-.2-3.4.4 1.4 1.4 1.8 2.4 1.8-.6 1-1.4 1.5-2.2 1.6z"/>',
        '<path class="body" d="M9.6 4.2 10.4 1l2 2.2L14 .8l1 3.4z"/>',
        '<path class="body" d="M12 3.8c0-2.4 1.6-3.4 3.2-3-.2 1.4-.8 2.2-1.6 2.6.8.4 1.2 1 1.2 1.8z"/>',
        '<ellipse class="body" cx="7.4" cy="7.4" rx="2.4" ry="1.9"/><ellipse class="body" cx="16.6" cy="7.4" rx="2.4" ry="1.9"/>',
      ];

      const moodblob = (bot, state) => {
        const body = pick(WOBBLE, bot.id, "w");
        const tuft = pick(TUFT, bot.id, "t");
        return svg(
          `<g class="rig">
             ${tuft}
             <path class="body" d="${body}"/>
             <path class="belly" d="${body}" opacity="0.55" transform="translate(-0.6 -0.9) scale(0.94)" transform-origin="12 12"/>
             <g class="eyes">${EYES_FOR(bot, state)}</g>
             ${MOUTH_FOR(bot, state)}
           </g>`,
        );
      };

      // =====================================================================
      // 02 Hat crew — one body, and the thing on its head is who it is. The
      // hat breaks the circle, so identity lives in the outline: the channel
      // that survives greyscale and 28px without needing to be read.
      // =====================================================================
      const HATS = {
        ears: '<path class="litefill" d="M4.8 10.4 5.2 2.8l5 5.2z"/><path class="litefill" d="M19.2 10.4 18.8 2.8l-5 5.2z"/>',
        antenna:
          '<path d="M12 5.4V2.4" stroke="var(--on-color)" stroke-width="3" stroke-linecap="round"/><path d="M12 5.4V2.4" stroke="var(--lite)" stroke-width="1.6" stroke-linecap="round"/><circle class="litefill" cx="12" cy="1.6" r="1.9"/>',
        horn: '<path class="litefill" d="M12 9.6 8.9 5.4 12 .2l3.1 5.2z"/>',
        cap: '<path class="litefill" d="M4.6 6.4a7.4 6.2 0 0 1 14.8 0z"/><rect class="litefill" x="2.6" y="5.6" width="18.8" height="2.4" rx="1.2"/>',
        halo: '<ellipse cx="12" cy="2.6" rx="5.4" ry="2" fill="none" stroke="var(--on-color)" stroke-width="3.4"/><ellipse cx="12" cy="2.6" rx="5.4" ry="2" fill="none" stroke="var(--lite)" stroke-width="1.9"/>',
        cans: '<path d="M4.4 8.6a7.6 7.6 0 0 1 15.2 0" fill="none" stroke="var(--on-color)" stroke-width="3.4"/><path d="M4.4 8.6a7.6 7.6 0 0 1 15.2 0" fill="none" stroke="var(--lite)" stroke-width="1.9"/><rect class="litefill" x="2" y="6.4" width="4.2" height="5.2" rx="1.8"/><rect class="litefill" x="17.8" y="6.4" width="4.2" height="5.2" rx="1.8"/>',
        sprout:
          '<path d="M12 6.4V3" stroke="var(--on-color)" stroke-width="3" stroke-linecap="round"/><path d="M12 6.4V3" stroke="var(--lite)" stroke-width="1.6" stroke-linecap="round"/><path class="litefill" d="M12 3.6c0-2.6 2.4-3.6 4.2-3.2.2 2.2-1.8 3.8-4.2 3.2z"/>',
        tuft: '<path class="litefill" d="M5.8 9.2c0-2.4 1.5-3.6 2.9-3.4C8.9 3.4 10.4 2 12 2s3.1 1.4 3.3 3.8c1.4-.2 2.9 1 2.9 3.4z"/>',
        bow: '<path class="litefill" d="M11.2 6.2 6.6 2.9l-.8 5.9z"/><path class="litefill" d="M12.8 6.2l4.6-3.3.8 5.9z"/><circle class="litefill" cx="12" cy="6.4" r="1.7"/>',
        crown:
          '<path class="litefill" d="M4.8 8V1.6l3 2.4L12 .4l4.2 3.6 3-2.4V8z"/>',
        rotor:
          '<path d="M12 6.8V3.4" stroke="var(--on-color)" stroke-width="3" stroke-linecap="round"/><path d="M12 6.8V3.4" stroke="var(--lite)" stroke-width="1.6" stroke-linecap="round"/><path class="litefill" d="M12 3c-2.8-2.2-5.8-.9-5.8.6 2.8 1.5 4.8.5 5.8-.6zM12 3c2.8-2.2 5.8-.9 5.8.6-2.8 1.5-4.8.5-5.8-.6z"/>',
        bucket:
          '<path class="litefill" d="M6.9 8V4.6a5.1 5.1 0 0 1 10.2 0V8z"/><rect class="litefill" x="3.4" y="6.6" width="17.2" height="2.6" rx="1.3"/>',
      };

      const HAT_KEYS = Object.keys(HATS);
      const HAT_OF = {};
      BOTS.forEach((b, i) => {
        HAT_OF[b.id] = HAT_KEYS[i % HAT_KEYS.length];
      });

      const hatcrew = (bot, state) =>
        svg(
          `<g class="rig">
             ${HATS[HAT_OF[bot.id]]}
             <circle class="body" cx="12" cy="14.6" r="7.4"/>
             <circle class="belly" cx="10.4" cy="12.8" r="5.2" opacity="0.5"/>
             <g class="eyes" transform="translate(0 2.4)">${EYES_FOR(bot, state, false)}</g>
             <g transform="translate(0 2.4)">${MOUTH_FOR(bot, state)}</g>
           </g>`,
        );

      // =====================================================================
      // 03 Critter kit — body, crest, eyes and mouth are dealt from the id, so
      // every bot is a different little animal and nobody picks anything.
      // =====================================================================
      const CBODY = [
        '<ellipse cx="12" cy="14" rx="8" ry="7.6"/>',
        '<ellipse cx="12" cy="13.6" rx="6.8" ry="8.4"/>',
        '<rect x="4.2" y="7.4" width="15.6" height="13.8" rx="6.6"/>',
        '<path d="M12 5.6c3.6 3.8 7.6 5.6 7.6 9.2A7.6 7.6 0 0 1 4.4 15c0-3.6 4-5.4 7.6-9.4z"/>',
        '<path d="M12 6c4.6 0 7.8 2.6 7.8 7.6S16.4 21.6 12 21.6 4.2 18.6 4.2 13.6 7.4 6 12 6z"/>',
      ];

      const CREST = [
        '<path class="body" d="M8.4 10.8c0-3.4 1.4-4.6 2.6-4.4C11.2 3.6 11.6 2.4 12 2.4s.8 1.2 1 4c1.2-.2 2.6 1 2.6 4.4z"/>',
        '<path class="body" d="M5.4 11.2 7 3.4l4.8 4.6z"/><path class="body" d="M18.6 11.2 17 3.4l-4.8 4.6z"/>',
        '<path d="M12 10V3.2" stroke="var(--deep)" stroke-width="1.6" stroke-linecap="round"/><circle class="body" cx="12" cy="2.4" r="1.7"/>',
        '<path class="body" d="M12 10.4 9.9 5.6 12 1.8l2.1 3.8z"/>',
        '<path class="body" d="M7.6 10.6 9.4 3.6l1.4 2.2L12 2.6l1.2 3.2 1.4-2.2 1.8 7z"/>',
        '<ellipse class="body" cx="4.4" cy="12.4" rx="2.4" ry="3.4"/><ellipse class="body" cx="19.6" cy="12.4" rx="2.4" ry="3.4"/>',
      ];

      const critter = (bot, state) =>
        svg(
          `<g class="rig">
             ${pick(CREST, bot.id, "c")}
             <g class="body">${pick(CBODY, bot.id, "b")}</g>
             <ellipse class="belly" cx="12" cy="15.6" rx="4.6" ry="4" opacity="0.55"/>
             <g class="eyes" transform="translate(0 1.6)">${EYES_FOR(bot, state)}</g>
             <g transform="translate(0 1.6)">${MOUTH_FOR(bot, state)}</g>
           </g>`,
        );

      // =====================================================================
      // 04 Pixel pets — eight by eight, hand-drawn, two paints. A sprite is
      // the one drawing style that was designed for small: at 28px each pixel
      // is 3.5 real pixels, which is what the format always was.
      // =====================================================================
      // X body, D shade, o ink, . nothing
      // Legend: X body, D shade, o ink, e an eye. Eyes get their own letter
      // because the state faces have to find them, and an antenna is ink too.
      const SPRITES = {
        // cat: ears out at the corners
        chief: [
          "XX....XX",
          "XXX..XXX",
          ".XXXXXX.",
          "XeXXXXeX",
          "XXXXXXXX",
          "XXXooXXX",
          "DXXXXXXD",
          ".XX..XX.",
        ],
        // bird: crest, and a beak that leaves the body
        scout: [
          "...X....",
          "..XXX...",
          ".XXXXX..",
          "XeXXXeX.",
          "XXXXXXoo",
          ".XXXXXX.",
          ".DXXXXD.",
          "..X..X..",
        ],
        // moth: two antennae in body shade so they stay attached
        mira: [
          "D......D",
          ".D....D.",
          "..XXXX..",
          ".XeXXeX.",
          "XXXXXXXX",
          "XXXXXXXX",
          "DXX..XXD",
          ".X....X.",
        ],
        // robot: flat head, one aerial, a grille
        atlas: [
          "...D....",
          "...X....",
          "XXXXXXXX",
          "XeXXXXeX",
          "XXXXXXXX",
          "XooooooX",
          "XXXXXXXX",
          "XX....XX",
        ],
        // star
        nova: [
          "...X....",
          "..XXX...",
          "XXXXXXXX",
          ".XeXXeX.",
          "..XXXX..",
          ".XXXXXX.",
          "XX.XX.XX",
          "X.......",
        ],
        // flame
        ember: [
          "....X...",
          "...XX...",
          "..XXXX..",
          ".XeXXeX.",
          "XXXXXXXX",
          "XXXooXXX",
          "DXXXXXXD",
          ".XXXXXX.",
        ],
        // ghost: no feet, a wavy hem
        pixel: [
          "..XXXX..",
          ".XXXXXX.",
          "XXXXXXXX",
          "XeXXXXeX",
          "XXXXXXXX",
          "XXXooXXX",
          "XXXXXXXX",
          "X.XX.XX.",
        ],
        // mushroom: wide cap, narrow stem
        sage: [
          "..XXXX..",
          ".XXXXXX.",
          "XXXXXXXX",
          "XXeXXeXX",
          ".DXXXXD.",
          "..XXXX..",
          "..XooX..",
          "..XXXX..",
        ],
        // fish: one eye, tail off the right edge
        vero: [
          "..XXX...",
          ".XXXXX.X",
          "XeXXXXXX",
          "XXXXXXXX",
          "XXXXXXXX",
          ".XXXXX.X",
          "..XXX...",
          "........",
        ],
        // crab: claws high and wide, legs below
        kilo: [
          "X......X",
          "XX....XX",
          ".XXXXXX.",
          ".XeXXeX.",
          "XXXXXXXX",
          "XXXooXXX",
          "XX.XX.XX",
          "X.X..X.X",
        ],
        // owl: tufts and two big eyes
        juno: [
          "X......X",
          "XXXXXXXX",
          "XeXXXXeX",
          "XoXXXXoX",
          "XXXooXXX",
          "XXXXXXXX",
          "DXXXXXXD",
          ".XX..XX.",
        ],
        // whale: spout and a fluke
        rhea: [
          "..D.....",
          "..D.....",
          ".XXXXXX.",
          "XeXXXXXX",
          "XXXXXXXX",
          "XXXXXXXo",
          ".XXXXXX.",
          "..X..X..",
        ],
      };

      const PAINT = {
        X: "var(--lite)",
        D: "var(--deep)",
        o: "var(--on-color)",
        e: "var(--on-color)",
      };

      const pixelpet = (bot, state) => {
        const rows = SPRITES[bot.id] || SPRITES.chief;
        const put = (x, y, paint) =>
          `<rect x="${x}" y="${y}" width="1" height="1" fill="${paint}"/>`;

        // Where the eyes are is a property of the sprite, not a constant: read
        // them out of the drawing so a state face lands on the right pixels
        // whatever creature this is.
        const eyes = [];
        rows.forEach((row, y) => {
          [...row].forEach((ch, x) => {
            if (ch === "e") eyes.push([x, y]);
          });
        });
        const at = (x, y) => (rows[y] || "")[x] || ".";

        let cells = "";
        rows.forEach((row, y) => {
          [...row].forEach((ch, x) => {
            if (ch !== ".") cells += put(x, y, PAINT[ch]);
          });
        });

        // Eight by eight has no room for X-ed out eyes, so the sprite uses the
        // conventions that fit: squeezed shut is a wider dark bar, and a brow
        // is one ink pixel above the eye.
        const solid = (x, y) => "XDeo".includes(at(x, y));

        let face = "";
        if (state === "failed")
          eyes.forEach(([x, y]) => {
            // Outward, never inward: two lids growing towards each other meet
            // in the middle and censor the face.
            const dx = x < 4 ? -1 : 1;
            if (solid(x + dx, y)) face += put(x + dx, y, PAINT.o);
          });
        if (state === "waiting")
          eyes.forEach(([x, y]) => {
            if (solid(x, y + 1)) face += put(x, y + 1, PAINT.o);
          });

        return `<svg viewBox="-0.5 -0.5 9 9" class="px" aria-hidden="true"><g class="rig">${cells}${face}</g></svg>`;
      };

      // =====================================================================
      // 05 Watchers — one, two or three eyes, and they follow the page. A bot
      // that needs you stops looking around and looks straight at you, which
      // is a status channel nothing else on either page can do.
      // =====================================================================
      const EYE_PLAN = [
        [[12, 11.6, 4.2]],
        [
          [8.4, 11.4, 3.2],
          [15.6, 11.4, 3.2],
        ],
        [
          [8, 12, 2.7],
          [16, 12, 2.7],
          [12, 7.4, 2.3],
        ],
        [
          [9, 10.6, 3.6],
          [15.8, 12.6, 2.6],
        ],
        [
          [7.8, 11, 2.4],
          [12, 12.4, 3.4],
          [16.2, 11, 2.4],
        ],
      ];

      // Dealt, not hashed: two bots on the same colour must not land on the
      // same eyes, and a hash has no way of knowing that.
      const PLAN_OF = {};
      BOTS.forEach((b, i) => {
        PLAN_OF[b.id] = EYE_PLAN[i % EYE_PLAN.length];
      });

      const watcher = (bot, state) => {
        const plan = PLAN_OF[bot.id];
        const body = pick(WOBBLE, bot.id, "w2");
        const eyes = plan
          .map(([cx, cy, r]) => {
            const pr = r * 0.46;
            const closed = state === "failed";
            return closed
              ? `<path class="inkstroke" d="M${cx - r * 0.6} ${cy}q${r * 0.6} ${r * 0.55} ${r * 1.2} 0"/>`
              : `<circle class="sclera" cx="${cx}" cy="${cy}" r="${r}"/>
                 <circle class="pupil" cx="${cx}" cy="${cy}" r="${pr}"/>`;
          })
          .join("");
        return svg(
          `<g class="rig">
             <path class="body" d="${body}"/>
             <g class="eyes">${eyes}</g>
             ${state === "waiting" ? '<path class="inkstroke" d="M6 6.4q2.6-1.5 5.2-.4"/><path class="inkstroke" d="M18 6.4q-2.6-1.5-5.2-.4"/>' : ""}
             ${state === "failed" ? '<path class="inkstroke" d="M9.8 18.4q2.2-2 4.4 0"/>' : ""}
           </g>`,
        );
      };

      // ---- one entry point, same signature for all five
      const DRAW = {
        m1: moodblob,
        m2: hatcrew,
        m3: critter,
        m4: pixelpet,
        m5: watcher,
      };

      function avatar(kind, bot, size, opts = {}) {
        const { state = "idle", unread = false } = opts;
        const chrome =
          (unread ? '<span class="dot"></span>' : "") +
          (state === "running" ? '<span class="ring"></span>' : "");
        const blink = (hash(bot.id + kind) % 40) / 10;
        return `<span class="av ${kind} ${bot.c}" style="--s:${size}px;--blink:-${blink}s" data-state="${state}" title="${bot.name}">${DRAW[kind](bot, state)}${chrome}</span>`;
      }

      // ---- rows
      const rampRow = (kind, bot) =>
        `<div class="ramp">${SIZES.map(
          ([px, n, where]) =>
            `<figure>${avatar(kind, bot, px)}<figcaption>${n}<br />${where}</figcaption></figure>`,
        ).join("")}</div>`;

      const gridRow = (kind) =>
        `<div class="grid">${BOTS.map(
          (b) =>
            `<figure>${avatar(kind, b, 38)}<figcaption>${b.name.split(" ")[0]}</figcaption></figure>`,
        ).join("")}</div>`;

      const stateRow = (kind) =>
        `<div class="states">${STATES.map(
          ([s, label], i) =>
            `<figure>${avatar(kind, BOTS[i + 1], 44, {
              state: s,
              unread: s === "waiting" || s === "failed",
            })}<figcaption>${label}</figcaption></figure>`,
        ).join("")}<figure>${avatar(kind, BOTS[5], 28, {
          state: "failed",
          unread: true,
        })}<figcaption>failed · 28</figcaption></figure></div>`;

      const crewOf = (kind) =>
        `<span class="cluster" style="--s:44px">${[BOTS[0], BOTS[2], BOTS[3]]
          .map((b, i) => `<i class="s${i + 1}">${avatar(kind, b, 25)}</i>`)
          .join("")}</span>`;

      const roleRow = (kind) => `<div class="states">
          <figure>${avatar(kind, BOTS[0], 44)}<figcaption>bot</figcaption></figure>
          <figure>${crewOf(kind)}<figcaption>crew</figcaption></figure>
          <figure><span class="codeav" style="--s:44px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8l4 4-4 4M12.5 16.5H18"/></svg></span><figcaption>code session</figcaption></figure>
        </div>`;

      const ctxRow = (kind) => `<div class="ctx">
        <div class="bar">${avatar(kind, BOTS[2], 28)}<div><div class="t">Mira</div></div><div class="m" style="margin-left:auto">chat header · 28</div></div>
        <div class="bar">${avatar(kind, BOTS[5], 38, { unread: true, state: "waiting" })}<div><div class="t">Ember</div><div class="m">Needs a decision before it can carry on</div></div></div>
      </div>`;

      const CANDIDATES = [
        {
          kind: "m1",
          title: "Moodblob",
          why: "The blob we already ship, with a face that answers back and a bit of itself sticking out — a cowlick, a curl, a pair of nubs. Its eyes, mouth and tuft are dealt from the id; the state takes the face over, squinting while it works, wide-eyed and browed when it needs you, screwed shut when it failed. Every one blinks on its own clock.",
          verdict: [
            ["yes", "Sizes", "The face is drawn in a 24-unit box, so 28px is the same face, not a shrunken one."],
            ["mid", "Greyscale", "The tuft puts something in the outline; the face alone was never going to carry it."],
            ["mid", "Beyond eight", "5 tufts × 6 eyes × 3 mouths, but the differences are small talk next to a hat."],
            ["yes", "Status", "The face carries it. No badge, no corner to fight the unread dot over."],
            ["yes", "Cost", "Smallest change on either page — it is the blob, awake."],
          ],
        },
        {
          kind: "m2",
          title: "Hat crew",
          why: "One body, and the thing on its head is who it is. The hat breaks the circle, so identity lives in the outline — the channel that survives greyscale and 28px without anybody having to read it. Cat ears, antenna, halo, headphones, crown, propeller.",
          verdict: [
            ["yes", "Sizes", "A hat is a bump on the silhouette; bumps survive the chat header."],
            ["yes", "Greyscale", "Outline is the signal, so hue is spare capacity."],
            ["yes", "Beyond eight", "Twelve hats × 8 colours, and hats are a set anyone can add to."],
            ["yes", "Status", "Face for state, hat for identity — they never compete."],
            ["mid", "Cost", "Somebody draws a hat per bot, and the crew has a house style to keep."],
          ],
        },
        {
          kind: "m3",
          title: "Critter kit",
          why: "Body, crest, eyes and mouth dealt from the id. Nobody picks anything and every bot is a different animal — five bodies × six crests × six eyes × three mouths, so the roster runs out long before the kit does.",
          verdict: [
            ["yes", "Sizes", "Silhouette first: the crest reads before the face does."],
            ["yes", "Greyscale", "Body shape and crest are both outline channels."],
            ["yes", "Beyond eight", "540 creatures before colour is asked for anything."],
            ["yes", "Status", "Same face vocabulary as 01, on a body that varies."],
            ["mid", "Cost", "Generated, so no two are wrong in the same way — and none is anyone's favourite either."],
          ],
        },
        {
          kind: "m4",
          title: "Pixel pets",
          why: "Eight by eight, hand-drawn, two paints and an ink. A sprite is the one drawing style designed for small — at 28px each pixel is three and a half real ones, which is the size the format always assumed.",
          verdict: [
            ["yes", "Sizes", "Crisp at every rung; the grid is the format, not a compromise."],
            ["yes", "Greyscale", "Two paints and hard edges — the strongest greyscale on either page."],
            ["mid", "Beyond eight", "A new bot needs a new sprite drawn, which is charm with a cost attached."],
            ["mid", "Status", "Two pixels of eye: taller for waiting, a shut lid for failed. It reads at 44 and is a squint at 28."],
            ["no", "Cost", "Someone has to be the pixel artist, forever."],
          ],
        },
        {
          kind: "m5",
          title: "Watchers",
          why: "One, two or three eyes, and they follow the page as you scroll. A bot that needs you stops looking around and looks straight at you — a status channel neither a badge nor a colour can do, and the only one on either page you notice without looking for it.",
          verdict: [
            ["yes", "Sizes", "Eyes are the biggest feature on the mark, so 28px loses least."],
            ["yes", "Greyscale", "One eye, two eyes and three eyes are three silhouettes."],
            ["mid", "Beyond eight", "Five arrangements × 8 colours; past that the eyes repeat."],
            ["yes", "Status", "Gaze. A bot that needs you is looking at you from across the sidebar."],
            ["mid", "Cost", "Motion in the sidebar is a decision, not a detail — and reduced-motion has to still work."],
          ],
        },
      ];

      const MARK = { yes: "✓", mid: "~", no: "✗" };

      const section = (c, i) => `<section>
        <h2><span class="n">0${i + 1}</span>${c.title}</h2>
        <p class="why">${c.why}</p>
        <div class="lbl">Size ramp</div>
        ${rampRow(c.kind, BOTS[0])}
        <div class="lbl">Twelve bots, eight colours</div>
        ${gridRow(c.kind)}
        <div class="lbl">The face is the status</div>
        ${stateRow(c.kind)}
        <p class="note">
          Idle is the bot's own face. The rest are the state's: the red dot
          still means unread and keeps its corner, and running keeps the rim,
          but waiting and failed are said with the eyes instead of a badge.
        </p>
        <div class="lbl">Bot · crew · code session</div>
        ${roleRow(c.kind)}
        <div class="lbl">In place</div>
        ${ctxRow(c.kind)}
        <div class="verdict">${c.verdict
          .map(
            ([m, k, t]) =>
              `<div><span class="${m}">${MARK[m]}</span><span><b>${k}.</b> ${t}</span></div>`,
          )
          .join("")}</div>
      </section>`;

      const COLLISIONS = [
        [0, 8],
        [1, 9],
        [2, 10],
        [4, 11],
      ];

      const headToHead = () => `<section>
        <h2><span class="n">vs</span>Head to head</h2>
        <p class="why">
          Same test as the systems page: the chat header, and the four pairs of
          bots the eight-colour palette forces onto one colour. Turn on
          greyscale and run the rows again — that is the silhouette test, and
          it is the whole argument for drawing characters instead of marks.
        </p>
        <div class="lbl">Chief of Staff at 28px</div>
        <div class="h2h"><div class="row">${CANDIDATES.map(
          (c) => `<span>${avatar(c.kind, BOTS[0], 28)}</span>`,
        ).join("")}</div></div>
        <div class="lbl">All four colour collisions at 38px</div>
        <div class="h2h">${CANDIDATES.map(
          (c) =>
            `<div class="row wrap"><b>${c.kind}</b>${COLLISIONS.map(
              ([a, z]) =>
                `<span class="pair">${avatar(c.kind, BOTS[a], 38)}${avatar(c.kind, BOTS[z], 38)}</span>`,
            ).join("")}</div>`,
        ).join("")}</div>
        <p class="note">
          In reading order: Chief/Vero teal · Scout/Kilo yellow · Mira/Juno
          purple · Nova/Rhea blue.
        </p>
        <div class="lbl">The same bot, needing you</div>
        <div class="h2h">${CANDIDATES.map(
          (c) =>
            `<div class="row"><b>${c.kind}</b><span class="pair">${avatar(
              c.kind,
              BOTS[2],
              44,
              { state: "waiting", unread: true },
            )}${avatar(c.kind, BOTS[2], 44, { state: "failed" })}</span><span class="cap">${c.title}</span></div>`,
        ).join("")}</div>
        <p class="note">
          Waiting on you, then failed. This is what a face buys: on the systems
          page these two are the same avatar wearing a different coloured dot.
        </p>
      </section>`;

      const stage = document.getElementById("stage");
      stage.innerHTML = CANDIDATES.map(section).join("") + headToHead();

      // ---- gaze. One pair of numbers for the whole page rather than per-eye
      // maths on two hundred avatars: everybody looks the same way at once,
      // which is what a room of characters actually does.
      let gx = 0;
      let gy = 0;
      const setGaze = (x, y) => {
        gx += (x - gx) * 0.5;
        gy += (y - gy) * 0.5;
        document.documentElement.style.setProperty("--gx", gx.toFixed(2));
        document.documentElement.style.setProperty("--gy", gy.toFixed(2));
      };

      addEventListener(
        "pointermove",
        (e) => {
          setGaze(
            ((e.clientX / innerWidth) * 2 - 1) * 1.1,
            ((e.clientY / innerHeight) * 2 - 1) * 1.1,
          );
        },
        { passive: true },
      );

      let lastY = scrollY;
      const bar = document.getElementById("bar");
      addEventListener(
        "scroll",
        () => {
          const dy = scrollY - lastY;
          lastY = scrollY;
          setGaze(0, Math.max(-1.2, Math.min(1.2, dy / 12)));
          bar.dataset.scrolled = scrollY > 24 ? "1" : "0";
        },
        { passive: true },
      );

      // ---- toggles
      const grey = document.getElementById("t-grey");
      const theme = document.getElementById("t-theme");
      const state = document.getElementById("t-state");

      grey.addEventListener("click", () => {
        const on = grey.getAttribute("aria-pressed") === "true";
        grey.setAttribute("aria-pressed", String(!on));
        stage.classList.toggle("grey", !on);
      });

      theme.addEventListener("click", () => {
        const on = theme.getAttribute("aria-pressed") === "true";
        theme.setAttribute("aria-pressed", String(!on));
        document.documentElement.dataset.theme = on ? "dark" : "light";
      });

      state.addEventListener("click", () => {
        const on = state.getAttribute("aria-pressed") === "true";
        state.setAttribute("aria-pressed", String(!on));
        stage.querySelectorAll(".dot, .ring").forEach((el) => {
          el.style.display = on ? "none" : "";
        });
      });
    </script>
  </body>
</html>
