  </defs>

  <rect x="0" y="0" width="880" height="220" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="879" height="219" rx="17.5" fill="none" stroke="#2A3140" stroke-width="1"/>

  <rect x="64" y="50" width="52" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="64" y="126" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#F0F6FC">jabstack</text>
  <text x="66" y="162" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="0.4" fill="#8B949E">a portable stack of agent skills</text>

  <g transform="translate(732 110)">
