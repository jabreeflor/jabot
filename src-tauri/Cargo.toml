[package]
name = "jabot"
version = "0.1.0"
description = "JaBot — bot-crew messenger with ACP harness sessions"
authors = ["JaBot"]
edition = "2021"
# The crate ships three binaries: the app itself, plus `jabot-hostd` (the host
# over stdio, for the e2e suite) and `fake-acp-agent` (a scriptable ACP agent
# for tests). The latter two are gated behind `dev-bins` below, so a plain
# build has only one; this says which one it is for anything run with the
# feature on, and for `tauri build`, which otherwise fails with "failed to find
# main binary".
default-run = "jabot"

[lib]
name = "jabot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The two test binaries are cargo targets only when this is on, which is how
# they stay out of `tauri build`: the bundler copies *every* binary cargo
# reports into `JaBot.app/Contents/MacOS`, and for `--target
# universal-apple-darwin` it lipos only the main one into the universal output
# directory, so the copy of the others fails on a path that was never written.
# Ungated, a release build dies after both full compiles have finished. Every
# stage that needs them asks for the feature; see scripts/verify.sh.
dev-bins = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri-build's allowlist is bidirectional and reads this list from the
# TOML: macOSPrivateApi in tauri.conf.json and this feature must match on
# every OS. The Windows/Linux *window* does not use the API: platform
# configs stay decorated/opaque, and window.rs returns before touching
# the webview fill (#282). Off Apple the feature is a compile flag.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
# Ships the update check against the signed release feed configured in
# tauri.conf.json. macOS-only alongside keyring so the Linux e2e build of
# jabot-hostd does not pay for reqwest; the matching `.plugin()` registration
# in lib.rs carries the same cfg.
tauri-plugin-updater = "2"
# UNUserNotificationCenter for the Inbox cards that deserve a banner (#27).
# macOS-only for the same reason as the two above: `src/notify/mac.rs` is the
# only file that names them, it is `cfg(target_os = "macos")`, and CI's verify
# job builds on Linux, where none of this is compiled or downloaded. Versions
# track the ones tauri already resolves, so nothing here forks the objc2 graph.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Same host APIs as macOS Keychain (#283): Windows Credential Manager
# generic credentials, target `{account}.{service}`. Windows-only — do not
# put the Apple objc2 crates in this table (TOML's next header owns every
# following key, and that is what broke macos clippy on PR #292).
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# WinRT toasts for Inbox cards (#284). Windows-only so Linux verify never
# downloads the windows crate graph. `src/notify/win.rs` is the only file
# that names this crate. We post and retain `ToastNotification` ourselves
# because a wrapper that drops the object after `Show` loses `Activated`.
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects + CTRL_BREAK for adapter kill-tree (#285). Feature list is the
# minimum CreateJobObject / TerminateJobObject / GenerateConsoleCtrlEvent need.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

# Declared rather than auto-discovered from src/bin/ so both carry the gate;
# an auto-discovered binary has no place to put `required-features`.
[[bin]]
name = "fake-acp-agent"
path = "src/bin/fake_acp_agent.rs"
required-features = ["dev-bins"]

[[bin]]
name = "jabot-hostd"
path = "src/bin/jabot-hostd.rs"
required-features = ["dev-bins"]
