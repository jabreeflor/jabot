[package]
name = "jabot"
version = "0.1.0"
description = "JaBot — bot-crew messenger with ACP harness sessions"
authors = ["JaBot"]
edition = "2021"
# The crate ships three binaries: the app itself, plus `jabot-hostd` (the host
# over stdio, for the e2e suite) and `fake-acp-agent` (a scriptable ACP agent
# for tests). `tauri build` bundles one binary and cannot guess which, so say so
# explicitly — without this it fails with "failed to find main binary".
default-run = "jabot"

[lib]
name = "jabot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.39", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
# Ships the update check against the signed release feed configured in
# tauri.conf.json. macOS-only alongside keyring so the Linux e2e build of
# jabot-hostd does not pay for reqwest. See docs/packaging.md for the one line
# of Builder setup this still needs in lib.rs.
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "fake-acp-agent"
path = "src/bin/fake_acp_agent.rs"
