[package]
name = "jabot"
version = "0.1.0"
description = "JaBot — bot-crew messenger with ACP harness sessions"
authors = ["JaBot"]
edition = "2021"

[lib]
name = "jabot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
