<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <title>JaBot</title>
    <!--
      Paint the stored palette before CSS/React load so the first frame is
      not a dark flash. Must stay in lockstep with THEME_KEY / resolveTheme
      in src/theme.ts: jabot.theme is dark | light | system, default dark.
    -->
    <script>
      (function () {
        var preference = "dark";
        try {
          var stored = localStorage.getItem("jabot.theme");
          if (stored === "light" || stored === "dark" || stored === "system") {
            preference = stored;
          }
        } catch (e) {}
        var resolved =
          preference === "light"
            ? "light"
            : preference === "system" &&
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        // live.sh preview only. The real app waits for the host to say the
        // native material applied (src/translucency.ts) so Linux/Windows
        // and Reduce Transparency stay opaque.
        try {
          if (
            /(?:^|[?&])translucency=preview(?:&|$)/.test(location.search)
          ) {
            document.documentElement.dataset.translucency = "on";
          }
        } catch (e) {}
        // Overlay is the CSS default (macOS / live.sh / Playwright). A
        // Windows *Tauri* webview and ?chrome=decorated drop the inset
        // before first paint. Must stay in lockstep with
        // inferredWindowChrome / previewWindowChrome in
        // src/windowChrome.ts. Do not key off UA alone: Playwright's
        // Desktop Chrome device is a Windows UA on Linux (#282).
        try {
          var inTauri = "__TAURI_INTERNALS__" in window;
          var chrome =
            inTauri && /Windows/i.test(navigator.userAgent)
              ? "decorated"
              : "overlay";
          var chromeMatch = /(?:^|[?&])chrome=(overlay|decorated)(?:&|$)/.exec(
            location.search,
          );
          if (chromeMatch) chrome = chromeMatch[1];
          document.documentElement.dataset.windowChrome = chrome;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
