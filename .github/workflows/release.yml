name: Release

# Tag -> build -> sign -> notarize -> publish, in one job on one runner.
#
# It is one job and not a matrix because the artifact is a universal binary:
# tauri-action expands a single universal `.app.tar.gz` into both the
# `darwin-aarch64` and `darwin-x86_64` entries of `latest.json`, which is what
# the updater plugin actually looks up (it has no `darwin-universal` fallback).
# Two per-arch jobs racing to merge the same `latest.json` asset buys nothing.
#
# Everything secret comes from repository secrets. The runbook for creating
# them, cutting a release, and verifying notarization is docs/packaging.md.

on:
  push:
    tags:
      - "v*"

# A re-pushed tag must not race the first run into the same GitHub Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      # tauri-action creates the release and uploads the bundles.
      contents: write
    steps:
      # Every `uses:` in this job is pinned to a commit SHA, not a tag or a
      # branch. This job holds the Developer ID .p12 and its password, the
      # Apple app-specific password, and the updater's Ed25519 private key, and
      # every step of a job shares one runner: a third-party action that moves
      # under us could plant a cargo config or build script that runs during
      # `tauri build` with all of those in the environment. Exfiltrating the
      # updater key in particular is unrecoverable — see the backup note in
      # docs/packaging.md. Tags can be force-moved and `@stable` is a branch,
      # so neither is a pin. docs/packaging.md says how to bump these.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Both failures below are cheap to detect and expensive to hit late: the
      # pubkey is only decoded after the whole app has compiled, and a version
      # mismatch produces a `latest.json` whose `version` disagrees with the
      # tag, so installed copies never see the update.
      - name: Preflight
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          conf_version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          if [[ "$tag_version" != "$conf_version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $conf_version"
            exit 1
          fi
          pubkey="$(node -p 'require("./src-tauri/tauri.conf.json").plugins.updater.pubkey')"
          if [[ "$pubkey" == REPLACE_ME* ]]; then
            echo "::error::plugins.updater.pubkey is still the placeholder — see docs/packaging.md"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-20
        with:
          # Named explicitly because the pin no longer says it: the action
          # defaults to stable, but the ref is where a reader would look.
          toolchain: stable
          # `--target universal-apple-darwin` lipos one build of each.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2 tag, 2026-08-20
        with:
          workspaces: src-tauri

      - run: npm ci

      # The bundler does the whole macOS pipeline itself once these env vars are
      # present: it imports APPLE_CERTIFICATE into a throwaway keychain, checks
      # the certificate against APPLE_SIGNING_IDENTITY, codesigns the .app and
      # every nested executable with entitlements.plist and hardened runtime,
      # then submits to notarytool and staples the ticket. No `security
      # create-keychain` dance — that is the Tauri v1 recipe and it greps for an
      # "Apple Development" identity, which is the wrong certificate type for
      # Developer ID distribution.
      #
      # TAURI_SIGNING_* is the separate Ed25519 (minisign) keypair the updater
      # uses. It is unrelated to Apple signing and cannot be turned off.
      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1 tag, 2026-08-20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: JaBot ${{ github.ref_name }}
          releaseBody: |
            macOS 13+, Apple Silicon and Intel.

            ```sh
            curl -fsSL https://github.com/jabreeflor/jabot/releases/latest/download/install.sh | bash
            ```

            Or download the `.dmg` and drag JaBot to Applications. The script
            does the same thing, and refuses to install a build that is not
            signed by us and notarized by Apple.

            Installed copies update themselves from `latest.json` in this
            release once it is published.
          # Draft, because publishing is what points
          # `releases/latest/download/latest.json` at this build — every
          # existing install starts updating the moment a human hits Publish.
          releaseDraft: true
          prerelease: false
          # `createUpdaterArtifacts` lives here rather than in tauri.conf.json
          # so that an unsigned `tauri build` (the CI bundle job, or a laptop)
          # still works: with it on, the bundler hard-errors unless
          # TAURI_SIGNING_PRIVATE_KEY is set.
          #
          # `--target universal-apple-darwin` only works because the crate's
          # two test binaries are gated behind the `dev-bins` feature: the
          # universal output directory receives one lipo'd binary, and the
          # bundler errors out copying any other binary cargo reports. See
          # src-tauri/Cargo.toml.
          args: >-
            --target universal-apple-darwin
            --config {"bundle":{"createUpdaterArtifacts":true}}

      # The installer, alongside the .dmg it installs.
      #
      # This is what makes
      # `releases/latest/download/install.sh` — the URL in the README, in the
      # release notes above, and in docs/packaging.md — resolve: an asset on
      # the latest *published* release. Serving it from `raw.githubusercontent`
      # on main instead would hand every new user whatever is on the default
      # branch, including a half-finished change to the installer, and would
      # let a user who pins `--version v0.1.0` be installed by a script that
      # never shipped with it.
      #
      # `gh` is preinstalled on the runner, so this needs no third-party action
      # in a job that holds all eight secrets. `--clobber` makes a re-pushed
      # tag idempotent; the release is still a draft here, which `gh release
      # upload` finds by tag like any other.
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" scripts/install.sh --clobber
