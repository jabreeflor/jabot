name: Release

# Every push to main ships: version -> build (macOS + Windows) -> verify the
# feed -> publish. Installed macOS copies pick the release up from
# `releases/latest/download/latest.json` within a few hours (or at once via
# JaBot -> Check for Updates…), so publishing *is* shipping.
#
#   version  computes the next X.Y.Z (scripts/release-version.mjs: the next
#            patch above the highest v* tag, or tauri.conf.json's version when
#            that is higher) and pushes the tag. Nothing is committed back to
#            main; each build job stamps the version into its own checkout.
#   macos    universal .app/.dmg, ad-hoc signed (no Apple Developer ID —
#            docs/packaging.md), plus the updater archive and latest.json
#            signed with the minisign key. Uploads to a *draft*.
#   windows  unsigned NSIS setup.exe onto the same release. Does not gate
#            publish: macOS is what installed copies update from, and a red
#            Windows build should not hold that back.
#   publish  downloads the draft's latest.json + archive, checks the version
#            and that the signature verifies against the pubkey compiled into
#            the app, and only then flips the draft to published.
#
# macos is one job and not a matrix because the artifact is a universal
# binary: tauri-action expands a single universal `.app.tar.gz` into both
# the `darwin-aarch64` and `darwin-x86_64` entries of `latest.json`, which
# is what the updater plugin actually looks up (it has no `darwin-universal`
# fallback).
#
# windows must not write `latest.json`: uploadUpdaterJson is false, the
# Windows host does not register the updater plugin (src-tauri/Cargo.toml /
# lib.rs), createUpdaterArtifacts stays off, and TAURI_SIGNING_* stays off
# this runner. Both jobs carry the same releaseBody because pinned
# tauri-action will not update name/body on an existing draft — whichever
# job creates the draft writes the notes. NSIS is the one primary Windows
# installer (#281); Authenticode / SmartScreen are a documented follow-up
# until a cert exists. Authenticode is not TAURI_SIGNING_*.
#
# The runbook (keys, retries, rollback) is docs/packaging.md.

on:
  push:
    branches: [main]
    # A docs-only push is not a new version of the app.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "prototypes/**"
      - "plugins/**"
      - ".claude/**"
      - ".cursor/**"
      - ".cursor-plugin/**"
      - ".agents/**"
  # Re-ship main by hand (e.g. after fixing a secret). Main only — see `if:`.
  workflow_dispatch:

# One release at a time, in push order. A run that is still building is never
# cancelled (it may already own a tag and a draft); a newer push waits, and if
# several pile up only the newest waiting one runs.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Pushes the tag.
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Every tag, so the next version is computed from all of them.
          fetch-depth: 0

      - id: next
        name: Next version
        run: node scripts/release-version.mjs next | tee -a "$GITHUB_OUTPUT"

      # Tagged up front, so a second run can never compute the same number.
      # A build that later fails leaves the tag behind with an unpublished
      # draft; the next push simply takes the next patch. A tag pushed with
      # GITHUB_TOKEN does not trigger other workflows.
      - name: Tag this commit
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  macos:
    needs: version
    runs-on: macos-latest
    permissions:
      # tauri-action creates the release and uploads the bundles.
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      # Every `uses:` in this job is pinned to a commit SHA, not a tag or a
      # branch. This job holds the updater's Ed25519 private key, and every
      # step of a job shares one runner: a third-party action that moves
      # under us could plant a cargo config or build script that runs during
      # `tauri build` with it in the environment. Exfiltrating the updater key
      # is unrecoverable — see the backup note in docs/packaging.md. Tags can
      # be force-moved and `@stable` is a branch, so neither is a pin.
      # docs/packaging.md says how to bump these.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-20
        with:
          # Named explicitly because the pin no longer says it: the action
          # defaults to stable, but the ref is where a reader would look.
          toolchain: stable
          # `--target universal-apple-darwin` lipos one build of each.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Current line (v26.x as of 2026-09). Same major as .nvmrc / .node-version.
          node-version: 26
          cache: npm

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2 tag, 2026-08-20
        with:
          workspaces: src-tauri

      - run: npm ci

      # After npm ci, which would otherwise compare the stamped package.json
      # against package-lock.json. tauri.conf.json's version is what lands
      # in Info.plist and in latest.json.
      - name: Stamp the version
        run: node scripts/release-version.mjs stamp "$VERSION"

      # Both failures below are cheap to detect and expensive to hit late: the
      # pubkey is only decoded after the whole app has compiled, and a version
      # mismatch produces a `latest.json` whose `version` disagrees with the
      # tag, so installed copies never see the update.
      - name: Preflight
        run: |
          set -euo pipefail
          conf_version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          if [[ "${TAG#v}" != "$conf_version" ]]; then
            echo "::error::tag $TAG does not match tauri.conf.json version $conf_version"
            exit 1
          fi
          pubkey="$(node -p 'require("./src-tauri/tauri.conf.json").plugins.updater.pubkey')"
          if [[ "$pubkey" == REPLACE_ME* ]]; then
            echo "::error::plugins.updater.pubkey is still the placeholder — see docs/packaging.md"
            exit 1
          fi

      # No Apple Developer ID: `signingIdentity: "-"` has the bundler ad-hoc
      # sign the .app (Apple Silicon will not run an unsigned binary at all),
      # and with no APPLE_* credentials it skips notarization. Installs come
      # through `install.sh --allow-unnotarized`, which never sets the
      # quarantine flag, and updates are trusted through the minisign
      # signature below, not through Apple. docs/packaging.md has the
      # trade-offs and how to switch to Developer ID later.
      #
      # TAURI_SIGNING_* is the Ed25519 (minisign) keypair the updater uses.
      # It is unrelated to Apple signing and cannot be turned off.
      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1 tag, 2026-08-20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: JaBot ${{ needs.version.outputs.tag }}
          releaseBody: |
            Built from ${{ github.sha }} on main. macOS 13+, Apple Silicon and Intel. Windows 10/11 x64 (NSIS).

            **macOS**

            ```sh
            curl -fsSL https://github.com/jabreeflor/jabot/releases/latest/download/install.sh | bash -s -- --allow-unnotarized
            ```

            This build is ad-hoc signed, not notarized by Apple, so install it
            with the line above rather than by opening the `.dmg` (a browser
            download is quarantined and Gatekeeper will refuse it). Installed
            copies update themselves from this feed; every update is checked
            against JaBot's own signing key before it is installed.

            **Windows**

            Download `JaBot_*_x64-setup.exe` from this release and run it.
            WebView2 is required (Windows 11 has it; the installer downloads
            it on Windows 10 if needed).

            The Windows installer is **not Authenticode-signed**. SmartScreen
            will show "Windows protected your PC" — More info → Run anyway.
            That is expected until a code-signing certificate exists; see
            docs/packaging.md. Windows auto-update is not shipped yet.
          # Draft until the publish job has checked the feed: publishing is
          # what points `releases/latest/download/latest.json` at this build,
          # and every installed copy starts updating to it.
          releaseDraft: true
          prerelease: false
          # `createUpdaterArtifacts` lives here rather than in tauri.conf.json
          # so that an unsigned `tauri build` (the CI bundle job, or a laptop)
          # still works: with it on, the bundler hard-errors unless
          # TAURI_SIGNING_PRIVATE_KEY is set. `signingIdentity` lives here so a
          # local `tauri build` is not ad-hoc signed behind anyone's back.
          #
          # `--target universal-apple-darwin` only works because the crate's
          # two test binaries are gated behind the `dev-bins` feature: the
          # universal output directory receives one lipo'd binary, and the
          # bundler errors out copying any other binary cargo reports. See
          # src-tauri/Cargo.toml.
          args: >-
            --target universal-apple-darwin
            --config {"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"-"}}}

      - name: Updater archives (not a signed install)
        run: |
          set -euo pipefail
          # Presence of the archive + sig the updater plugin consumes. The
          # signature itself is checked by the publish job.
          dir=""
          for candidate in \
            src-tauri/target/universal-apple-darwin/release/bundle \
            src-tauri/target/release/bundle
          do
            if [ -d "$candidate" ]; then
              dir="$candidate"
              break
            fi
          done
          if [ -z "$dir" ]; then
            echo "::error::no bundle output directory — cannot check updater archives"
            exit 1
          fi
          ./scripts/macos-acceptance.sh updater-artifacts "$dir"
          ./scripts/macos-acceptance.sh release-checklist

      # The installer, alongside the .dmg it installs.
      #
      # This is what makes
      # `releases/latest/download/install.sh` — the URL in the README, in the
      # release notes above, and in docs/packaging.md — resolve: an asset on
      # the latest *published* release. Serving it from `raw.githubusercontent`
      # on main instead would hand every new user whatever is on the default
      # branch, including a half-finished change to the installer, and would
      # let a user who pins `--version v0.1.0` be installed by a script that
      # never shipped with it.
      #
      # `gh` is preinstalled on the runner, so this needs no third-party
      # action in a job that holds the updater key. `--clobber` makes a re-run
      # idempotent; the release is still a draft here, which `gh release
      # upload` finds by tag like any other.
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" scripts/install.sh --clobber

  # NSIS setup.exe for Windows 10/11 x64. Parallel with macos: tauri-action
  # creates or attaches to the same draft by tag. This job holds only
  # GITHUB_TOKEN — no updater signing key, no createUpdaterArtifacts, and
  # uploadUpdaterJson is false — so a compromise here cannot steal the feed
  # key or rewrite latest.json. releaseBody is the same as macos: pinned
  # tauri-action does not update name/body on an existing draft, so whoever
  # creates it must write the full notes (macOS install line + unsigned /
  # SmartScreen). If this finishes after publish, it uploads onto the
  # published release instead.
  windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    defaults:
      run:
        # GitHub-hosted Windows images have Git Bash. The adapter staging
        # script and this file's checks are bash; npm run bundle:adapters
        # invokes it through bash so beforeBuildCommand works here.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08-20
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2 tag, 2026-08-20
        with:
          workspaces: src-tauri
          prefix-key: release-windows

      # npm's default script-shell on windows-latest is cmd.exe; several
      # package.json scripts are bash (`prepare`, `bundle:adapters`,
      # `build:app`). beforeBuildCommand is spawned by the Tauri CLI, not
      # this job's defaults.run.shell, so point npm at Git Bash *before*
      # npm ci and tauri-action (same recipe as #290).
      - name: Point npm scripts at Git Bash
        run: npm config set script-shell "$(command -v bash)"

      - run: npm ci

      - name: Stamp the version
        run: node scripts/release-version.mjs stamp "$VERSION"

      - name: Preflight
        run: |
          set -euo pipefail
          conf_version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          if [[ "${TAG#v}" != "$conf_version" ]]; then
            echo "::error::tag $TAG does not match tauri.conf.json version $conf_version"
            exit 1
          fi

      # Unsigned NSIS. tauri.windows.conf.json already sets targets to
      # ["nsis"]; --bundles nsis makes that explicit if the platform file
      # is ignored. Do not pass --config createUpdaterArtifacts, do not
      # export TAURI_SIGNING_*, and keep uploadUpdaterJson false — the
      # action default is true and would rewrite latest.json if a .sig ever
      # lands on this draft.
      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1 tag, 2026-08-20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: JaBot ${{ needs.version.outputs.tag }}
          releaseBody: |
            Built from ${{ github.sha }} on main. macOS 13+, Apple Silicon and Intel. Windows 10/11 x64 (NSIS).

            **macOS**

            ```sh
            curl -fsSL https://github.com/jabreeflor/jabot/releases/latest/download/install.sh | bash -s -- --allow-unnotarized
            ```

            This build is ad-hoc signed, not notarized by Apple, so install it
            with the line above rather than by opening the `.dmg` (a browser
            download is quarantined and Gatekeeper will refuse it). Installed
            copies update themselves from this feed; every update is checked
            against JaBot's own signing key before it is installed.

            **Windows**

            Download `JaBot_*_x64-setup.exe` from this release and run it.
            WebView2 is required (Windows 11 has it; the installer downloads
            it on Windows 10 if needed).

            The Windows installer is **not Authenticode-signed**. SmartScreen
            will show "Windows protected your PC" — More info → Run anyway.
            That is expected until a code-signing certificate exists; see
            docs/packaging.md. Windows auto-update is not shipped yet.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: >-
            --target x86_64-pc-windows-msvc
            --bundles nsis

      - name: NSIS installer present (not Authenticode)
        run: ./scripts/windows-packaging.sh artifacts

  # The last gate before every installed copy fetches this build. Runs on a
  # runner that never saw the signing key, against what was actually
  # uploaded, not what the macos job meant to upload.
  publish:
    needs: [version, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the draft's feed
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir feed --pattern latest.json --pattern '*.app.tar.gz'
          ls -l feed

      # Version matches, both darwin entries exist, and each signature
      # verifies against plugins.updater.pubkey — i.e. an installed JaBot
      # will accept this, rather than silently refuse it forever.
      - name: Verify the feed
        run: node scripts/release-verify-feed.mjs feed "$VERSION"

      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest
