name: Windows

# Targeted Windows compile/test so the desktop port does not rot (#286 / #280).
# Split from ci.yml so this file can grow a planner without touching the
# Ubuntu verify/browser jobs or the macOS bundle/lint jobs.
#
# windows-latest bills at 2x. The Linux `verify` job already owns frontend,
# e2e, and Playwright. This workflow therefore:
#
# * always starts a cheap Linux planner on PRs / dispatch / tags;
# * starts `windows verify` only when host/toolchain/CI paths change
#   (or on tags / dispatch) — docs-only PRs do not get a Windows runner;
# * builds an unsigned NSIS installer only on a `windows-package` label
#   or workflow_dispatch with `package=true`. Tag NSIS belongs to
#   release.yml (#281 / #291), not this file.
#
# Failures are real: no `continue-on-error`. A red job means the Windows
# crate or the portable tests broke. It does not mean a human smoked the
# app on a PC — see docs/windows-ci.md.

on:
  pull_request:
    # `labeled` so adding `windows-package` later starts the package job
    # without a dummy push. Verify skips `labeled`, and labeled runs sit
    # in their own concurrency group, so `size:*` / `agent-ready` cannot
    # cancel and re-bill an in-flight 2× verify.
    types: [opened, synchronize, reopened, labeled]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Also build an unsigned NSIS installer (not every run)
        type: boolean
        default: false

concurrency:
  # Isolate `labeled` so adding any label cannot cancel a running verify.
  group: windows-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && 'labeled' || 'head' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

jobs:
  windows-plan:
    name: windows plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.plan.outputs.verify }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the PR base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
      - id: plan
        name: Classify changed paths
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            ./scripts/windows-needed.sh --force-verify --github-output
          else
            ./scripts/windows-needed.sh \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head HEAD \
              --github-output
          fi
      - name: Summarize
        run: |
          {
            echo "### Windows CI plan"
            echo
            echo "| check | run | why |"
            echo "| --- | --- | --- |"
            echo "| windows verify | ${{ steps.plan.outputs.verify }} | \`scripts/windows-verify.sh\` — compile + portable cargo test |"
            echo "| windows package | \`windows-package\` label / dispatch \`package\` | unsigned NSIS; not every PR; tags are release.yml |"
            echo
            echo "A \`0\` means the Windows runner is not started."
            echo "See \`docs/windows-ci.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  windows-verify:
    name: windows verify
    needs: windows-plan
    if: needs.windows-plan.outputs.verify == '1' && github.event.action != 'labeled'
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: windows-verify
      - name: Compile host crate and run portable tests
        run: ./scripts/windows-verify.sh

  # Unsigned NSIS only. Full Windows product packaging (targets, signing,
  # release upload) is #281. MSI/WiX is not installed on this runner.
  # SmartScreen reputation and a real-PC smoke stay human — docs/windows-ci.md.
  windows-package:
    name: windows package
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.package) ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'windows-package') ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'windows-package'))
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          # Current line (v26.x as of 2026-09). Same major as .nvmrc / verify.
          node-version: 26
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: windows-package
      # npm's default script-shell on this runner is cmd.exe; several
      # package.json scripts are bash. Point npm at Git Bash so
      # `beforeBuildCommand` (`npm run build:app`) can stage adapters.
      - name: Point npm scripts at Git Bash
        run: npm config set script-shell "$(command -v bash)"
      - run: npm ci
      - run: npm run bundle:adapters
      - name: Build unsigned NSIS installer
        run: npm run tauri -- build --bundles nsis
      - name: Retain Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/**
          if-no-files-found: error
          retention-days: 14
